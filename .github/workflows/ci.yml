name: ci

on:
  push:
    branches: [main, "m*-**", "v*-**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOLANGCI_LINT_VERSION: v1.64.8

jobs:
  # 正确性检查：任何失败都阻断。
  correctness:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16-alpine
        env:
          POSTGRES_USER: agentbox
          POSTGRES_PASSWORD: agentbox
          POSTGRES_DB: agentbox
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentbox -d agentbox"
          --health-interval 2s --health-timeout 2s --health-retries 30
      redis:
        image: public.ecr.aws/docker/library/redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      # 事务语义只在真实 PostgreSQL 上测试；CI 中未设置时数据库测试失败而不是跳过。
      AGENTBOX_TEST_DATABASE_URL: postgres://agentbox:agentbox@localhost:5432/agentbox?sslmode=disable
      # 缓存用例使用真实 Redis；CI 中未设置时失败而不是跳过。
      AGENTBOX_TEST_REDIS_ADDR: localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build (linux，生产二进制 CGO_ENABLED=0)
        run: CGO_ENABLED=0 go build ./...
      - name: build (windows，开发机平台)
        run: GOOS=windows go build ./...
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: vet
        run: go vet ./...
      # -race 覆盖 actor、runner、coordinator 的并发（Plan 5/6 联合验收）；本地 WSL 无 gcc，只在 CI 运行。
      # tests/e2e 需要 python3（runner 镜像自带）与上面的 PostgreSQL。
      - name: unit tests（非 root，-race；需要 root 的用例按设计跳过）
        run: go test -race -count=1 -timeout 20m ./...
      - name: golangci-lint（正确性）
        uses: golangci/golangci-lint-action@v6
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --config .golangci.yml

  # 复杂度报告：只报告，不阻断；工具本身出错仍会失败（--issues-exit-code=0 只放过发现项）。
  # PR 上只报告本次新增或修改的问题。
  complexity-report:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: golangci-lint（复杂度信号）
        uses: golangci/golangci-lint-action@v6
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          only-new-issues: ${{ github.event_name == 'pull_request' }}
          args: --config .golangci-complexity.yml --issues-exit-code=0

  # Linux 集成测试：以 root 运行；先验证 runner 能力，再要求无任何 skip。
  linux-integration:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16-alpine
        env:
          POSTGRES_USER: agentbox
          POSTGRES_PASSWORD: agentbox
          POSTGRES_DB: agentbox
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentbox -d agentbox"
          --health-interval 2s --health-timeout 2s --health-retries 30
      redis:
        image: public.ecr.aws/docker/library/redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      # 事务语义只在真实 PostgreSQL 上测试；CI 中未设置时数据库测试失败而不是跳过。
      AGENTBOX_TEST_DATABASE_URL: postgres://agentbox:agentbox@localhost:5432/agentbox?sslmode=disable
      # 缓存用例使用真实 Redis；CI 中未设置时失败而不是跳过。
      AGENTBOX_TEST_REDIS_ADDR: localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: 验证 runner 能力（cgroup v2、挂载、namespace、新挂载 API、close_range）
        run: sudo bash scripts/ci/check-runner.sh
      # 默认 rootfs 模板要求宿主存在 /opt/agentbox（worker 包目录，规格 §4.5）；真实沙箱用例在其中运行 sim_worker 与 deepresearch。
      - name: 安装 worker 包到 /opt/agentbox（默认模板的必需路径）
        run: |
          sudo mkdir -p /opt/agentbox
          sudo cp -r worker/agentbox_worker worker/sim_worker worker/deepresearch /opt/agentbox/
          ls /opt/agentbox
      # 生产二进制与 helper 固定 CGO_ENABLED=0（静态、无 libc 线程初始化）；doctor 逐项输出宿主能力。
      # correctness 作业的 -race 需要 cgo，保持默认，不受此约束。
      - name: 构建生产二进制（CGO_ENABLED=0）并运行 doctor
        run: |
          CGO_ENABLED=0 go build -o bin/agentbox ./cmd/agentbox
          sudo ./bin/agentbox doctor
      # go test 的退出码是主判据；citestjson 只补充检查 skip、中断与执行数量，不能替代退出码。
      # 两者都先执行完（以便都留下诊断输出），最后一起判定。
      # tests/e2e 的真实沙箱会话用例（E28–E33；E29、E30 各等待一次 T_release = 30 s）使该测试二进制可能超过默认的 10 min。
      - name: root 测试与判定
        run: |
          set +e
          sudo -E env "PATH=$PATH" CGO_ENABLED=0 go test -json -count=1 -timeout 40m ./... > test.json
          test_exit=$?
          go run ./tools/citestjson test.json scripts/ci/allowed-skips.txt
          judge_exit=$?
          echo "go test 退出码=$test_exit，citestjson 退出码=$judge_exit"
          [ "$test_exit" -eq 0 ] && [ "$judge_exit" -eq 0 ]
      - name: 上传测试记录
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-integration-test-json
          path: test.json

  # Python Worker SDK：最低支持版本 3.11 必须实际覆盖。
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.14"
      - name: 安装依赖（锁文件必须最新）
        run: uv sync --locked --python ${{ matrix.python }}
      - name: ruff（正确性与禁用 API）
        run: uv run ruff check .
      - name: ruff 格式
        run: uv run ruff format --check .
      - name: 模块依赖契约
        run: uv run lint-imports
      - name: pytest（含真实进程端到端测试）
        run: uv run pytest -q
      - name: 复杂度报告（只报告，不阻断）
        run: uv run ruff check --select C90 --exit-zero .

  # Vue 工作台（规格 §15）：lint、类型检查、Vitest，并确认提交的生成类型与 api/openapi.yaml 一致。
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: 安装依赖（锁文件必须最新）
        run: npm ci
      - name: eslint
        run: npm run lint
      - name: 类型检查（vue-tsc）
        run: npm run typecheck
      - name: Vitest（单元与组件测试）
        run: npm test
      - name: 生成类型与契约一致（npm run gen:api 后无差异）
        run: |
          npm run gen:api
          git diff --exit-code src/api/schema.d.ts
      - name: 生产构建（产物不提交）
        run: npm run build
