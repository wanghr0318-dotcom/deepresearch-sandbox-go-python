# 最小运行依赖（规格 §3.1）：PostgreSQL 是唯一的元数据存储；Redis 只是可丢弃的结果缓存（§11），不保存任何状态。
# 本地开发与测试：
#   docker compose -f deploy/docker-compose.yml up -d
#   export AGENTBOX_TEST_DATABASE_URL='postgres://agentbox:agentbox@127.0.0.1:5432/agentbox?sslmode=disable'
#   export AGENTBOX_TEST_REDIS_ADDR=127.0.0.1:6379
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agentbox
      POSTGRES_PASSWORD: agentbox
      POSTGRES_DB: agentbox
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentbox -d agentbox"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - agentbox-pg:/var/lib/postgresql/data

  # 缓存不持久化（无 RDB/AOF）：Redis 丢失数据只造成未命中。
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  agentbox-pg:
