# ValidatingAdmissionPolicy for the sandbox namespace (docs/design/2026-10-10-k8s-provider-design.md §2.4).
#
# The node-local slot volumes are hostPath, which Pod Security "baseline" forbids, so the namespace cannot
# enforce PSS. Without this policy the server's ServiceAccount (pods: create) could mount any host path or
# run privileged Pods. The policy applies to every Pod in agentbox-sandbox — not only to Pods carrying the
# agentbox.io/managed label, which a compromised server could simply omit — and requires:
#   - volumes: only emptyDir and hostPath (no projected/secret/configMap/serviceAccountToken/PVC …);
#   - hostPath: exactly <slot dir>/abx-<12 hex>/workspace or …/run. The slot directory and these two
#     subdirectories are created by the server (root, the slot directory 0700), so a sandbox cannot replace
#     them with symlinks; a deeper path such as …/workspace/x (which a sandbox could make a symlink to /,
#     and the kubelet would follow) is refused. Edit SLOT_PATTERN if --k8s-node-shared-dir differs from
#     /var/lib/agentbox-k8s/data/k8s-slots (regex-quote the directory);
#   - no host network/PID/IPC, no hostPort, no ServiceAccount token, default ServiceAccount only, no init or
#     ephemeral containers (the policy also matches the pods/ephemeralcontainers subresource, through which
#     ephemeral containers are added to a running Pod);
#   - Pod: runAsNonRoot, non-zero runAsUser, RuntimeDefault seccomp;
#   - every container: no privilege escalation, not privileged, read-only root, capabilities drop ALL and add
#     none, and no container-level override of runAsNonRoot (false), runAsUser (0) or seccomp (other than
#     RuntimeDefault);
#   - the remaining Pod Security "restricted" fields, on the Pod and on every container: AppArmor only
#     RuntimeDefault or Localhost (field or legacy annotation), procMount Default, SELinux type only one of the
#     container types and no SELinux user/role, no Windows HostProcess, and no sysctls at all (stricter than
#     PSS, which allows a "safe" set; the provider sets none). hostUsers is not constrained: a user-namespaced
#     Pod (hostUsers: false) gets no relaxation here — every rule above still applies to it.
# Requires Kubernetes 1.30+ (admissionregistration.k8s.io/v1).
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: agentbox-sandbox-pods
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods", "pods/ephemeralcontainers"]
  variables:
    - name: slotPattern
      expression: "'^/var/lib/agentbox-k8s/data/k8s-slots/abx-[0-9a-f]{12}/(workspace|run)$'" # SLOT_PATTERN
    - name: containers
      expression: >-
        object.spec.containers +
        (has(object.spec.initContainers) ? object.spec.initContainers : []) +
        (has(object.spec.ephemeralContainers) ? object.spec.ephemeralContainers : [])
    - name: seLinuxTypes
      expression: "['', 'container_t', 'container_init_t', 'container_kvm_t', 'container_engine_t']"
  validations:
    - expression: >-
        !has(object.spec.volumes) || object.spec.volumes.all(v, has(v.emptyDir) ||
        (has(v.hostPath) && v.hostPath.path.matches(variables.slotPattern)))
      message: "only emptyDir volumes and hostPath volumes of the form <slot dir>/abx-<12 hex>/(workspace|run) are allowed"
    - expression: >-
        !(has(object.spec.hostNetwork) && object.spec.hostNetwork) &&
        !(has(object.spec.hostPID) && object.spec.hostPID) &&
        !(has(object.spec.hostIPC) && object.spec.hostIPC)
      message: "host namespaces are not allowed"
    - expression: >-
        has(object.spec.automountServiceAccountToken) && object.spec.automountServiceAccountToken == false &&
        (!has(object.spec.serviceAccountName) || object.spec.serviceAccountName == 'default')
      message: "automountServiceAccountToken must be false and only the default ServiceAccount may be used"
    - expression: >-
        (!has(object.spec.initContainers) || size(object.spec.initContainers) == 0) &&
        (!has(object.spec.ephemeralContainers) || size(object.spec.ephemeralContainers) == 0)
      message: "init and ephemeral containers are not allowed"
    - expression: >-
        has(object.spec.securityContext) && has(object.spec.securityContext.runAsNonRoot) &&
        object.spec.securityContext.runAsNonRoot &&
        (!has(object.spec.securityContext.runAsUser) || object.spec.securityContext.runAsUser != 0) &&
        has(object.spec.securityContext.seccompProfile) &&
        object.spec.securityContext.seccompProfile.type == 'RuntimeDefault'
      message: "pod securityContext must set runAsNonRoot, a non-root runAsUser and RuntimeDefault seccomp"
    - expression: >-
        variables.containers.all(c,
          (!has(c.ports) || c.ports.all(p, !has(p.hostPort) || p.hostPort == 0)) &&
          has(c.securityContext) &&
          has(c.securityContext.allowPrivilegeEscalation) && c.securityContext.allowPrivilegeEscalation == false &&
          (!has(c.securityContext.privileged) || c.securityContext.privileged == false) &&
          (!has(c.securityContext.runAsUser) || c.securityContext.runAsUser != 0) &&
          (!has(c.securityContext.runAsNonRoot) || c.securityContext.runAsNonRoot) &&
          (!has(c.securityContext.seccompProfile) || c.securityContext.seccompProfile.type == 'RuntimeDefault') &&
          has(c.securityContext.readOnlyRootFilesystem) && c.securityContext.readOnlyRootFilesystem &&
          has(c.securityContext.capabilities) && has(c.securityContext.capabilities.drop) &&
          c.securityContext.capabilities.drop.exists(d, d == 'ALL') &&
          (!has(c.securityContext.capabilities.add) || size(c.securityContext.capabilities.add) == 0))
      message: "containers must be unprivileged: no escalation, read-only root, drop ALL, no hostPort, and no runAsNonRoot/runAsUser/seccomp override"
    - expression: >-
        !has(object.spec.securityContext) || (
          (!has(object.spec.securityContext.sysctls) || size(object.spec.securityContext.sysctls) == 0) &&
          (!has(object.spec.securityContext.appArmorProfile) ||
            object.spec.securityContext.appArmorProfile.type in ['RuntimeDefault', 'Localhost']) &&
          (!has(object.spec.securityContext.seLinuxOptions) || (
            (!has(object.spec.securityContext.seLinuxOptions.type) ||
              object.spec.securityContext.seLinuxOptions.type in variables.seLinuxTypes) &&
            (!has(object.spec.securityContext.seLinuxOptions.user) || object.spec.securityContext.seLinuxOptions.user == '') &&
            (!has(object.spec.securityContext.seLinuxOptions.role) || object.spec.securityContext.seLinuxOptions.role == ''))) &&
          (!has(object.spec.securityContext.windowsOptions) ||
            !has(object.spec.securityContext.windowsOptions.hostProcess) ||
            !object.spec.securityContext.windowsOptions.hostProcess))
      message: "pod securityContext: no sysctls, AppArmor RuntimeDefault/Localhost only, SELinux container types only (no user/role), no Windows HostProcess"
    - expression: >-
        !has(object.metadata.annotations) || object.metadata.annotations.all(k,
          !k.startsWith('container.apparmor.security.beta.kubernetes.io/') ||
          object.metadata.annotations[k] == 'runtime/default' || object.metadata.annotations[k].startsWith('localhost/'))
      message: "AppArmor annotations may only select runtime/default or localhost/<profile>"
    - expression: >-
        variables.containers.all(c, !has(c.securityContext) || (
          (!has(c.securityContext.procMount) || c.securityContext.procMount == 'Default') &&
          (!has(c.securityContext.appArmorProfile) ||
            c.securityContext.appArmorProfile.type in ['RuntimeDefault', 'Localhost']) &&
          (!has(c.securityContext.seLinuxOptions) || (
            (!has(c.securityContext.seLinuxOptions.type) || c.securityContext.seLinuxOptions.type in variables.seLinuxTypes) &&
            (!has(c.securityContext.seLinuxOptions.user) || c.securityContext.seLinuxOptions.user == '') &&
            (!has(c.securityContext.seLinuxOptions.role) || c.securityContext.seLinuxOptions.role == ''))) &&
          (!has(c.securityContext.windowsOptions) || !has(c.securityContext.windowsOptions.hostProcess) ||
            !c.securityContext.windowsOptions.hostProcess)))
      message: "containers: procMount Default, AppArmor RuntimeDefault/Localhost only, SELinux container types only (no user/role), no Windows HostProcess"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: agentbox-sandbox-pods
spec:
  policyName: agentbox-sandbox-pods
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: agentbox-sandbox
