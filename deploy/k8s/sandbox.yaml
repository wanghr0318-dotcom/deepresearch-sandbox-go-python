# Namespace and least-privilege RBAC for the Kubernetes provider (docs/design/2026-10-10-k8s-provider-design.md).
# The server's ServiceAccount can manage Pods, exec into them and create the deny-all NetworkPolicy — only in
# this namespace. Sandbox Pods themselves get no ServiceAccount token (automountServiceAccountToken: false).
#
# Pod Security Standards: the sandbox Pod spec meets "restricted" except for the two hostPath volumes of the
# node-local slot directory (workspace and Gateway socket), which "baseline" forbids; the namespace is
# therefore not labelled for enforcement. Instead, admission-policy.yaml (ValidatingAdmissionPolicy) constrains
# every Pod in this namespace — hostPath only of the exact slot form, emptyDir otherwise, restricted securityContext — so the
# ServiceAccount's pods:create cannot be used to mount arbitrary host paths. See the design doc §2.2 and §2.4.
apiVersion: v1
kind: Namespace
metadata:
  name: agentbox-sandbox
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentbox-server
  namespace: agentbox-sandbox
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agentbox-server
  namespace: agentbox-sandbox
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["create"] # the provider only creates the deny-all policy (AlreadyExists is fine)
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agentbox-server
  namespace: agentbox-sandbox
subjects:
  - kind: ServiceAccount
    name: agentbox-server
    namespace: agentbox-sandbox
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agentbox-server
