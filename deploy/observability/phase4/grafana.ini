[server]
enable_gzip = true
http_addr = 127.0.0.1
http_port = 3000
[paths]
data = /var/lib/abx-grafana
plugins = /var/lib/abx-grafana/plugins
logs = /var/lib/abx-grafana/logs
provisioning = /opt/agentbox-phase4-monitor/provisioning
[auth.anonymous]
enabled = true
org_role = Viewer
[analytics]
reporting_enabled = false
check_for_updates = false
[plugins]
preinstall_disabled = true
