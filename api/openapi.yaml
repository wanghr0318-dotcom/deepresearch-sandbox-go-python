openapi: 3.0.3
info:
  title: agentbox API
  version: 0.2.0-m1
  description: |
    The single contract for the agentbox HTTP API (design spec §15). M1 scope: tasks and status; M3 adds
    user accounts; M4 adds chat sessions (`/sessions`, `/turns`, see "Sessions" below).

    Access (§15.3): the server binds 127.0.0.1 by default. Any other address requires the static
    Bearer token from `<data>/api.token` (0600) on every request. The `Host` header and, when present,
    the `Origin` header must match explicit allowlists; there is no wildcard CORS. The token never
    appears in URLs or logs.

    Modes (`GET /status`): `normal` serves everything; `diagnostic` serves only `/status` and
    `/tasks/{id}/inspect` (other operations return 503 `diagnostic_mode`); `ownership_lost` refuses
    write operations with 503 `ownership_lost`.

    Idempotency: every write carries `request_id`. `body_hash` is the SHA-256 of the canonical JSON
    request body (sorted keys, no whitespace; control requests also include the task id and the
    action). The same `request_id` with the same content returns the first result; different content
    returns 409 `request_conflict`.

    User accounts (M3): when the server enables accounts, `/auth/*` and `/research` are served and a
    second credential is accepted, the `agentbox_session` cookie (`HttpOnly; SameSite=Strict; Path=/`,
    plus `Secure` on a TLS listener; valid 7 days, not renewed). A request with an `Authorization`
    header is judged by the Bearer token only (wrong token is 401, never a fallback to the cookie);
    the Bearer caller is the operator and keeps full access. Otherwise the session cookie identifies a
    user. Anonymous callers may use only `POST /auth/register`, `POST /auth/login`, `GET /status` and
    static files; everything else is 401 `unauthorized`. A user may call `POST /research`, `GET /tasks`
    (own tasks only), `GET /tasks/{id}`, `/events`, `/result`, `/artifacts/...` and
    `POST /tasks/{id}/cancel`; another user's task, an unowned task and a missing task all answer the
    same 404 `task_not_found`. Every other operation answers a user with 403 `forbidden`, and the
    session-only operations (`/auth/logout`, `/auth/me`, `/research`) answer the operator with 403
    `forbidden`. Register and login are rate limited per client IP (5 and 10 per minute; 429
    `rate_limited`). With accounts enabled the operator always needs a valid Bearer token: if no token
    is configured, any `Authorization` header is 401 and credential-less requests are anonymous. Users
    get a redacted view of tasks and events (see `GET /tasks/{id}` and `GET /tasks/{id}/events`).
    Without accounts only the Bearer token applies, exactly as above.

    Sessions (M4): a chat session belongs to the user who created it; each message starts a turn, and a
    turn is a task (`turn_id` = `task_id`, so a turn's report downloads through
    `/tasks/{turn_id}/artifacts/...`). A user may call every `/sessions` and `/turns` operation, and is
    the only one who may write to their sessions. Another user's session, an unowned session, a missing
    session and (for a user) a `closed` session all answer the same 404 `session_not_found`; turns
    likewise answer 404 `turn_not_found`. The operator may read every session, turn and event stream
    (`GET` operations, with `owner` and `internal_state` in the session view and the raw record in each
    event's `internal`), but every write operation answers the operator with 403 `forbidden` (the
    operator does not chat as a user). A user's `GET /tasks` does not list turns. When the server has no
    session worker configured, every session operation answers 503 `sessions_unavailable`. All 4xx/5xx
    bodies are `Error`; the session-specific codes are listed in `SessionErrorCode`.

    Tenancy and API keys (model gateway design 2026-10-11 §5, §8): with accounts enabled every user belongs
    to exactly one org (at sign-up a personal org `user-<id>` with the user as owner). Platform API keys
    `abx_live_<id>_<secret>` are accepted as `Authorization: Bearer abx_live_...` or `x-api-key`; a Bearer
    value that does not start with `abx_` is still the operator token. A key acts as its user: with the
    `runtime` scope it may call every operation a user session may call (sessions, turns, research, own
    tasks), except `POST /auth/logout`; without it those answer 403 `permission_denied`. A key never
    manages keys, members, invites or orgs (403 `permission_denied`) and never reaches operator operations.
    An invalid, revoked or expired key is 401 `invalid_api_key` (never a fallback to the cookie); an
    `x-api-key` value that does not start with `abx_` is ignored. Verified keys are cached for 30 s;
    revocation is pushed to every server at once (PostgreSQL NOTIFY). Users move between orgs only with
    their consent: an owner invites, the user accepts; personal orgs accept no other members; the
    operator may move users directly. With tenancy on, the operator token must not start with `abx_`.
servers:
  - url: http://127.0.0.1:8080
security:
  - bearerAuth: []
  - cookieAuth: []
  - apiKeyAuth: []
paths:
  /auth/register:
    post:
      operationId: register
      summary: Create a user account and sign in (anonymous; rate limited per IP)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Credentials'}
      responses:
        '201':
          description: Account created; the response sets the `agentbox_session` cookie
          headers:
            Set-Cookie:
              description: '`agentbox_session=...; Path=/; Max-Age=604800; HttpOnly; SameSite=Strict` (plus `Secure` on TLS)'
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '400':
          description: '`invalid_request`, `invalid_username` (3–32 of `[A-Za-z0-9_.-]`) or `invalid_password` (8–16 characters, at least two of digits/upper/lower)'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409':
          description: '`username_taken`: the username is taken (case-insensitive)'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/Internal'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /auth/login:
    post:
      operationId: login
      summary: Sign in (anonymous; rate limited per IP)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Credentials'}
      responses:
        '200':
          description: Signed in; the response sets the `agentbox_session` cookie
          headers:
            Set-Cookie:
              description: '`agentbox_session=...; Path=/; Max-Age=604800; HttpOnly; SameSite=Strict` (plus `Secure` on TLS)'
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401':
          description: '`invalid_credentials`: the same body for an unknown user, a wrong password and a disabled account; or `unauthorized` (wrong Bearer token)'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/Internal'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /auth/logout:
    post:
      operationId: logout
      summary: Sign out (deletes the session; session only)
      security:
        - cookieAuth: []
      responses:
        '204':
          description: Session deleted; the response clears the cookie (`Max-Age=0`)
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/Internal'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /auth/me:
    get:
      operationId: me
      summary: The signed-in user (session only)
      security:
        - cookieAuth: []
      responses:
        '200':
          description: The user
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/Internal'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /research:
    post:
      operationId: createResearch
      summary: Start a research task on a topic (session only; idempotent by request_id)
      description: |
        The server builds the task spec from the topic (fixed orchestrator and worker models and search
        configuration) and applies the server's default limits; the user cannot choose models, budget or
        limits. The task is owned by the user. A user may have at most one non-terminal task at a time.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ResearchRequest'}
      responses:
        '202':
          description: Research task created, or the first result of the same request replayed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CreateTaskResult'}
        '400':
          description: '`invalid_request`; or `invalid_topic`: the trimmed topic is empty or longer than 500 characters'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409':
          description: '`user_task_running`: the user already has a non-terminal task; or `request_conflict`'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429': {$ref: '#/components/responses/RuntimeRateLimited'}
        '500': {$ref: '#/components/responses/Internal'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /status:
    get:
      operationId: getStatus
      summary: Health and service mode (anonymous when accounts are enabled)
      responses:
        '200':
          description: Current mode
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Status'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /tasks:
    get:
      operationId: listTasks
      summary: List tasks, newest first (keyset pagination)
      parameters:
        - name: after
          in: query
          description: The `next` cursor of the previous page; omit for the first page.
          schema: {type: string}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 200, default: 50}
      responses:
        '200':
          description: One page of tasks
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskList'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/Internal'}
        '503': {$ref: '#/components/responses/Unavailable'}
    post:
      operationId: createTask
      summary: Create a task (idempotent by request_id)
      description: >-
        Operator only. With `session_id` the task is a turn of that session (spec §15.1; the operator path used by the
        serial-vs-parallel research comparison). It goes through the same transaction as a user message and belongs to
        the session's owner. `spec` may then contain only `text`, `deep_research` and `research`; the server builds the
        turn spec (models, limits) exactly as for a user message and overlays the keys of `research` onto
        `spec.research` (for example `scheduling` and `fixed_plan`, validated by the worker). `limits` must be omitted.
        Errors are those of `POST /sessions/{id}/messages` (404 `session_not_found`, 409 `turn_in_progress`,
        `user_task_running` or `session_closed`, 503 `sessions_unavailable`).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateTaskRequest'}
      responses:
        '201':
          description: Task created, or the first result of the same request replayed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CreateTaskResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/Internal'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /tasks/{id}:
    parameters:
      - {$ref: '#/components/parameters/TaskID'}
    get:
      operationId: getTask
      summary: Current view of a task
      description: A user (session) gets the same view without `current_attempt_id`; `GET /tasks` lists use the same view. The operator view is unchanged.
      responses:
        '200':
          description: The task
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Task'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/Internal'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /tasks/{id}/cancel:
    parameters:
      - {$ref: '#/components/parameters/TaskID'}
    post:
      operationId: cancelTask
      summary: Request cancellation (idempotent by request_id)
      requestBody: {$ref: '#/components/requestBodies/Control'}
      responses:
        '200': {$ref: '#/components/responses/ControlAccepted'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/ControlRejected'}
        '500': {$ref: '#/components/responses/Internal'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /tasks/{id}/pause:
    parameters:
      - {$ref: '#/components/parameters/TaskID'}
    post:
      operationId: pauseTask
      summary: Request a pause (idempotent by request_id)
      requestBody: {$ref: '#/components/requestBodies/Control'}
      responses:
        '200': {$ref: '#/components/responses/ControlAccepted'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/ControlRejected'}
        '500': {$ref: '#/components/responses/Internal'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /tasks/{id}/resume:
    parameters:
      - {$ref: '#/components/parameters/TaskID'}
    post:
      operationId: resumeTask
      summary: Resume a paused task (idempotent by request_id)
      requestBody: {$ref: '#/components/requestBodies/Control'}
      responses:
        '200': {$ref: '#/components/responses/ControlAccepted'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/ControlRejected'}
        '500': {$ref: '#/components/responses/Internal'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /tasks/{id}/events:
    parameters:
      - {$ref: '#/components/parameters/TaskID'}
    get:
      operationId: streamTaskEvents
      summary: Server-sent event stream of a task (§15.2)
      description: |
        Each event has `id` = task_seq, `event` = the event type and `data` = an Event JSON object.
        Resume with `Last-Event-ID`; all events are kept in v0.2, so cursors never expire. A heartbeat
        comment line (`: heartbeat`) is sent every 15 s and takes no sequence number. The server closes
        the stream after `task_terminal`; clients stop reconnecting once they receive it.

        User view (session caller; the operator sees every event unchanged). Only these events are sent,
        keyed `source/type`, and their `payload` keeps only the listed fields:
        `host/task_created` (none), `host/attempt_created` (`attempt_no`),
        `host/control_accepted` (`desired`, `control_version`), `host/control_applied` (`status`,
        `control_version`), `host/checkpoint_committed` (`checkpoint_id`, `commit_seq`, `step_id`),
        `host/artifact_saved` (`artifact_id`, `version`), `host/attempt_ended` and `host/task_terminal`
        (`task_status`, `status_reason`), `host/turn_stopped` (none; the host's fallback stop card, whose
        content is sent as a `turn_stopped` session event), `worker/progress` (`step_id`, `kind`, `message`),
        `worker/result` (`summary`, `outputs`). `worker_seq` is omitted. Every other event (for example
        Gateway `replay_divergence`, worker `ready`, `checkpoint`, `checkpoint_query`, `artifact`,
        `paused`, `error`) is not sent, and no cost, budget, model, call, try, usage, token or
        environment field is ever sent. Dropped events keep their task_seq, so ids stay increasing with
        gaps, and any existing task_seq (including a dropped one) is a valid `Last-Event-ID`.
      parameters:
        - name: Last-Event-ID
          in: header
          description: Resume after this task_seq. Must be a non-negative integer not beyond the latest event.
          schema: {type: integer, format: int64, minimum: 0}
      responses:
        '200':
          description: Event stream
          content:
            text/event-stream:
              schema: {type: string}
        '400':
          description: Malformed request or `invalid_cursor` (malformed, or beyond the latest event)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/Internal'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /tasks/{id}/result:
    parameters:
      - {$ref: '#/components/parameters/TaskID'}
    get:
      operationId: getTaskResult
      summary: The pinned result of a terminal task
      description: |
        The result recorded when the task ended, with its outputs pinned to `(artifact_id, version, sha256)`
        (spec §5.6). The body is canonical JSON (sorted keys, no whitespace) and `ETag` is the quoted SHA-256
        of the body; clients verify it.
      responses:
        '200':
          description: The pinned result
          headers:
            ETag:
              description: The quoted SHA-256 of the body
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Result'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404':
          description: '`task_not_found`; or `not_ready`: the task is terminal but recorded no result (failed, or cancelled before completing)'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '409':
          description: '`task_not_terminal`: the task has not ended yet'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '500': {$ref: '#/components/responses/Internal'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /tasks/{id}/artifacts/{artifact_id}:
    parameters:
      - {$ref: '#/components/parameters/TaskID'}
      - {$ref: '#/components/parameters/ArtifactID'}
    get:
      operationId: getArtifact
      summary: Download the latest artifact version; `?version=N` is an alias of `/versions/{v}`
      description: |
        Only `visibility = output` artifacts are downloadable; an `internal` artifact answers exactly like a
        missing one (404 `artifact_not_found`). If the latest version is internal or unauthorized the answer is
        404, never an older version.
      parameters:
        - name: version
          in: query
          description: Alias of `/tasks/{id}/artifacts/{artifact_id}/versions/{v}` (the canonical pinned path, spec §15.1); omit for the latest version.
          schema: {type: integer, format: int64, minimum: 1}
      responses:
        '200': {$ref: '#/components/responses/Blob'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/ArtifactNotFound'}
        '500': {$ref: '#/components/responses/BlobUnavailable'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /tasks/{id}/artifacts/{artifact_id}/versions/{v}:
    parameters:
      - {$ref: '#/components/parameters/TaskID'}
      - {$ref: '#/components/parameters/ArtifactID'}
      - name: v
        in: path
        required: true
        schema: {type: integer, format: int64, minimum: 1}
    get:
      operationId: getArtifactVersion
      summary: Download one pinned artifact version (canonical path, spec §15.1); only `visibility = output` versions are served
      responses:
        '200': {$ref: '#/components/responses/Blob'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/ArtifactNotFound'}
        '500': {$ref: '#/components/responses/BlobUnavailable'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /tasks/{id}/inspect:
    parameters:
      - {$ref: '#/components/parameters/TaskID'}
    get:
      operationId: inspectTask
      summary: Diagnostic timeline (§14.6); also served in diagnostic mode
      responses:
        '200':
          description: Attempts with outcome, exit and OOM diagnosis, environment and cleanup state, checkpoints, Gateway calls with their tries (task_id → attempt_id → call_id → try_no), the task-layer ledger and the sub-runs with their own ledger layer (§15.4)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Inspection'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/Internal'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /server-info:
    get:
      operationId: getServerInfo
      summary: Build and non-secret configuration of the server (operator only; served in every mode)
      description: |
        Used by `agentbox eval` to pin the evaluated server in a run manifest. Contains the build (module
        version, VCS revision, Go version), `config_version`, the default and declared models, the search
        provider, the task worker command, whether sessions and exec are enabled and the exec template
        digest. Never contains keys, tokens, prices or URLs. With accounts enabled a user gets 403.
      responses:
        '200':
          description: Server info
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ServerInfo'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /sessions:
    post:
      operationId: createSession
      summary: Create a chat session (owner only; idempotent by request_id)
      description: |
        The session starts with the given title, or empty until the first message sets it to the first
        40 characters of that message. The same `request_id` with the same content returns the first
        result (201 again); different content is 409 `request_conflict`.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateSessionRequest'}
      responses:
        '201':
          description: Session created, or the first result of the same request replayed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
        '400':
          description: '`invalid_request`; or `invalid_title`: the trimmed title is longer than 80 characters'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/RuntimeRateLimited'}
        '500': {$ref: '#/components/responses/Internal'}
        '503': {$ref: '#/components/responses/SessionsUnavailable'}
    get:
      operationId: listSessions
      summary: List sessions, most recently active first (keyset pagination)
      description: |
        Ordered by `last_active_at` descending (ties by `session_id`). A user sees only their own sessions
        and never `closed` ones; the operator sees every session with `owner` and `internal_state`.
      parameters:
        - name: after
          in: query
          description: The `next` cursor of the previous page; omit for the first page.
          schema: {type: string}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 200, default: 50}
      responses:
        '200':
          description: One page of sessions
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionList'}
        '400':
          description: '`invalid_request` (bad limit); or `invalid_cursor`: `after` is malformed'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/Internal'}
        '503': {$ref: '#/components/responses/SessionsUnavailable'}
  /sessions/{id}:
    parameters:
      - {$ref: '#/components/parameters/SessionID'}
    get:
      operationId: getSession
      summary: Current view of a session
      responses:
        '200':
          description: The session
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/SessionNotFound'}
        '500': {$ref: '#/components/responses/Internal'}
        '503': {$ref: '#/components/responses/SessionsUnavailable'}
    patch:
      operationId: renameSession
      summary: Rename a session (owner only)
      description: Sets the title (trimmed, 1–80 characters); an explicit title is never replaced by the automatic one.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RenameSessionRequest'}
      responses:
        '200':
          description: The renamed session
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
        '400':
          description: '`invalid_request`; or `invalid_title`: the trimmed title is empty or longer than 80 characters'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/SessionNotFound'}
        '409':
          description: '`session_closed`: the session is being deleted'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '500': {$ref: '#/components/responses/Internal'}
        '503': {$ref: '#/components/responses/SessionsUnavailable'}
    delete:
      operationId: deleteSession
      summary: Delete a session (owner only; idempotent)
      description: |
        Refuses new messages, cancels queued and paused turns, cancels and releases a running turn, stops
        the environment and then deletes the workspace (`closing` → `closed`). Pinned reports stay in the
        operator records and disappear from the user view. Repeating the call while the session is
        `closing` returns 202 again; once it is `closed` the session is gone for the user (404).
      responses:
        '202':
          description: Deletion accepted; `state = closing`
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/SessionNotFound'}
        '500': {$ref: '#/components/responses/Internal'}
        '503': {$ref: '#/components/responses/SessionsUnavailable'}
  /sessions/{id}/wake:
    parameters:
      - {$ref: '#/components/parameters/SessionID'}
    post:
      operationId: wakeSession
      summary: Wake a frozen or evicted session ahead of the next message (owner only; idempotent by request_id)
      description: |
        Asynchronous: progress is reported by `session_state` events (`restoring`, then `idle`; or `evicted`
        with `user_message` when it cannot be restored). Waking an `idle` or `running` session is a no-op.
        A new message wakes the session by itself; this call only hides the restore latency.
      requestBody: {$ref: '#/components/requestBodies/SessionWrite'}
      responses:
        '202':
          description: Wake requested (or nothing to do), or the first result of the same request replayed
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/SessionNotFound'}
        '409':
          description: '`session_closed`: the session is being deleted; or `request_conflict`'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429': {$ref: '#/components/responses/RuntimeRateLimited'}
        '500': {$ref: '#/components/responses/Internal'}
        '503': {$ref: '#/components/responses/SessionsUnavailable'}
  /sessions/{id}/messages:
    parameters:
      - {$ref: '#/components/parameters/SessionID'}
    post:
      operationId: sendMessage
      summary: Send a message, starting a new turn (owner only; idempotent by request_id)
      description: |
        Turns are not queued. If the session has a `queued`, `running` or `stopping` (cancelling) turn the
        message is rejected with 409 `turn_in_progress` (stop the current research first). If it has a
        `paused` or `awaiting_input` turn, or one that is stopping by pause, that turn is cancelled
        (reason `superseded`; its content is kept and it stays restorable) and returned as
        `superseded_turn_id`; its sources and finished subtopic summaries are given to the new turn as
        context. A frozen or evicted session is woken. A user may have at most one `queued`, `running` or
        `stopping` turn or research task across all sessions (409 `user_task_running`). The new turn gets
        a fresh tool-call budget (`tool_call_limit`).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MessageRequest'}
      responses:
        '202':
          description: Turn created, or the first result of the same request replayed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MessageResult'}
        '400':
          description: '`invalid_request`; or `invalid_text`: the trimmed text is empty or longer than 4000 characters'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/SessionNotFound'}
        '409':
          description: '`session_closed`, `turn_in_progress`, `user_task_running`, or `request_conflict`'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429': {$ref: '#/components/responses/RuntimeRateLimited'}
        '500': {$ref: '#/components/responses/Internal'}
        '503': {$ref: '#/components/responses/SessionsUnavailable'}
  /sessions/{id}/turns:
    parameters:
      - {$ref: '#/components/parameters/SessionID'}
    get:
      operationId: listTurns
      summary: Turns of a session in `turn_index` order (history)
      parameters:
        - name: after_index
          in: query
          description: Return turns with `turn_index` greater than this; omit for the first page.
          schema: {type: integer, format: int64, minimum: 0}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 200, default: 50}
      responses:
        '200':
          description: Up to `limit` turns, `turn_index` ascending; fewer than `limit` means the end
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TurnList'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/SessionNotFound'}
        '500': {$ref: '#/components/responses/Internal'}
        '503': {$ref: '#/components/responses/SessionsUnavailable'}
  /sessions/{id}/events:
    parameters:
      - {$ref: '#/components/parameters/SessionID'}
    get:
      operationId: streamSessionEvents
      summary: Server-sent event stream of a whole session (every turn and the session lifecycle)
      description: |
        Each event has `id` = `seq` (the session-wide sequence, monotonic and gap-free in storage),
        `event` = the event type and `data` = a `SessionEvent` JSON object. Resume with `Last-Event-ID`;
        events are kept for the life of the session. A heartbeat comment line (`: heartbeat`) is sent
        every 15 s and takes no sequence number. The stream stays open across turns and closes after a
        `session_state` event with `state = closed`; clients stop reconnecting once they receive it.

        A user sees only the types in `SessionEventType` other than `internal`, and each `data` keeps
        only the fields of its schema: costs, prices, usage, model names and internal IDs (call, attempt,
        worker sequence, upstream request) are removed at any depth. Records the user cannot see (other
        host and worker events, transitional session states) keep their `seq`, so ids increase with gaps,
        and any existing `seq` (including a hidden one) is a valid `Last-Event-ID`. The operator sees
        every record: mapped ones with `internal` attached, the rest as `type = internal`.
      parameters:
        - name: Last-Event-ID
          in: header
          description: Resume after this seq. Must be a non-negative integer not beyond the latest event.
          schema: {type: integer, format: int64, minimum: 0}
      responses:
        '200':
          description: Event stream (`data` of each event is a `SessionEvent`)
          content:
            text/event-stream:
              schema: {type: string}
        '400':
          description: Malformed request or `invalid_cursor` (malformed, or beyond the latest event)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/SessionNotFound'}
        '500': {$ref: '#/components/responses/Internal'}
        '503': {$ref: '#/components/responses/SessionsUnavailable'}
  /turns/{id}/stop:
    parameters:
      - {$ref: '#/components/parameters/TurnID'}
    post:
      operationId: stopTurn
      summary: Stop a queued or running turn (owner only; idempotent by request_id)
      description: |
        Requests a pause (`stopping` → `paused`); the turn keeps its last checkpoint and the worker reports
        a `turn_stopped` card. When the worker cannot (it does not finish within the stop grace and is ended
        by the host, the host restarts meanwhile, or the turn was still queued), the host writes a fallback
        `turn_stopped` card of the same shape (counts from the turn's events, fixed findings), so continue
        and finish stay available. Any other status is 409 `invalid_turn_state`.
      requestBody: {$ref: '#/components/requestBodies/SessionWrite'}
      responses:
        '202': {$ref: '#/components/responses/TurnControlAccepted'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/TurnNotFound'}
        '409': {$ref: '#/components/responses/TurnControlRejected'}
        '500': {$ref: '#/components/responses/Internal'}
        '503': {$ref: '#/components/responses/SessionsUnavailable'}
  /turns/{id}/continue:
    parameters:
      - {$ref: '#/components/parameters/TurnID'}
    post:
      operationId: continueTurn
      summary: Continue a stopped (`paused`) turn from where it stopped (owner only; idempotent by request_id)
      description: Requires `status = paused` (not `awaiting_input`, which takes `/answer`); otherwise 409 `invalid_turn_state`.
      requestBody: {$ref: '#/components/requestBodies/SessionWrite'}
      responses:
        '202': {$ref: '#/components/responses/TurnControlAccepted'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/TurnNotFound'}
        '409': {$ref: '#/components/responses/TurnControlRejected'}
        '429': {$ref: '#/components/responses/RuntimeRateLimited'}
        '500': {$ref: '#/components/responses/Internal'}
        '503': {$ref: '#/components/responses/SessionsUnavailable'}
  /turns/{id}/finish:
    parameters:
      - {$ref: '#/components/parameters/TurnID'}
    post:
      operationId: finishTurn
      summary: Resume a stopped (`paused`) turn with "write the report now" (owner only; idempotent by request_id)
      description: |
        Requires `status = paused` (not `awaiting_input`); otherwise 409 `invalid_turn_state`. The remaining
        subtopics are skipped and the report is written from the material gathered so far
        (`report_ready.partial = true`).
      requestBody: {$ref: '#/components/requestBodies/SessionWrite'}
      responses:
        '202': {$ref: '#/components/responses/TurnControlAccepted'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/TurnNotFound'}
        '409': {$ref: '#/components/responses/TurnControlRejected'}
        '429': {$ref: '#/components/responses/RuntimeRateLimited'}
        '500': {$ref: '#/components/responses/Internal'}
        '503': {$ref: '#/components/responses/SessionsUnavailable'}
  /turns/{id}/answer:
    parameters:
      - {$ref: '#/components/parameters/TurnID'}
    post:
      operationId: answerTurn
      summary: Answer the questions of an `awaiting_input` turn and resume it (owner only; idempotent by request_id)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AnswerRequest'}
      responses:
        '202': {$ref: '#/components/responses/TurnControlAccepted'}
        '400':
          description: '`invalid_request`; or `invalid_answers`: not 1–3 answers, an empty `question_id`, or not exactly one of `choice` and `other`'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/TurnNotFound'}
        '409': {$ref: '#/components/responses/TurnControlRejected'}
        '429': {$ref: '#/components/responses/RuntimeRateLimited'}
        '500': {$ref: '#/components/responses/Internal'}
        '503': {$ref: '#/components/responses/SessionsUnavailable'}
  /turns/{id}/restore:
    parameters:
      - {$ref: '#/components/parameters/TurnID'}
    post:
      operationId: restoreTurn
      summary: Start a new turn that continues a cancelled turn from its last checkpoint (owner only; idempotent by request_id)
      description: |
        The new turn (same session, same text, `deep_research = true`, `restored_from_turn_id` = this turn)
        continues from the source turn's last checkpoint with a fresh tool-call budget. The same rules as
        `POST /sessions/{id}/messages` apply to other turns of the session (`turn_in_progress`; a paused
        turn is superseded).
      requestBody: {$ref: '#/components/requestBodies/SessionWrite'}
      responses:
        '202':
          description: The new turn, or the first result of the same request replayed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MessageResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/TurnNotFound'}
        '409':
          description: '`not_restorable` (the turn is not cancelled or has no checkpoint), `session_closed`, `turn_in_progress`, `user_task_running`, or `request_conflict`'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429': {$ref: '#/components/responses/RuntimeRateLimited'}
        '500': {$ref: '#/components/responses/Internal'}
        '503': {$ref: '#/components/responses/SessionsUnavailable'}
  /turns/{id}/raw/{sha256}:
    parameters:
      - {$ref: '#/components/parameters/TurnID'}
      - name: sha256
        in: path
        required: true
        description: The `raw.response_ref` of a `thinking`, `tool_call` or `tool_result` event (64 lowercase hex digits)
        schema: {type: string, pattern: '^[0-9a-f]{64}$'}
    get:
      operationId: getTurnRaw
      summary: Download a raw model or tool response of a turn (⟨/⟩), redacted for users
      description: |
        Only blobs authorized to the turn are served. A user gets the content with internal fields removed
        at any depth (costs, prices, usage, model, call and attempt IDs, upstream request id, system
        fingerprint) and the top-level `id`; the operator gets it unchanged. Non-JSON content is sent
        unchanged as `application/octet-stream`. An unauthorized blob, a malformed hash, another user's
        turn and a missing one all answer the same 404 `not_found`.
      responses:
        '200':
          description: The (redacted) content
          headers:
            Content-Disposition:
              description: Always `attachment`
              schema: {type: string}
            X-Content-Type-Options:
              description: Always `nosniff`
              schema: {type: string}
          content:
            application/json:
              schema: {}
            application/octet-stream:
              schema: {type: string, format: binary}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404':
          description: '`not_found`'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '500': {$ref: '#/components/responses/BlobUnavailable'}
        '503': {$ref: '#/components/responses/SessionsUnavailable'}
  /v1/me:
    get:
      operationId: getMe
      summary: The authenticated caller (operator, user session or API key of any scope)
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiKeyAuth: []
      responses:
        '200':
          description: The caller's principal
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Me'}
        '401': {$ref: '#/components/responses/KeyUnauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/Internal'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/keys:
    post:
      operationId: createKey
      summary: Create a platform API key (the full key is returned once)
      description: |
        A user session creates keys for itself only, in its current org; the operator must name the user
        (`username`). API keys can never create keys (403 `permission_denied`). Only the HMAC of the secret is
        stored; the full `abx_live_<id>_<secret>` key appears in this response and nowhere else.
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateKeyRequest'}
      responses:
        '201':
          description: The key, including the full secret (shown once)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CreatedKey'}
        '400':
          description: '`invalid_request` (name, expires_at in the past, operator without username) or `invalid_scopes`'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401': {$ref: '#/components/responses/KeyUnauthorized'}
        '403': {$ref: '#/components/responses/KeyForbidden'}
        '404':
          description: '`user_not_found`'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '500': {$ref: '#/components/responses/Internal'}
        '503': {$ref: '#/components/responses/Unavailable'}
    get:
      operationId: listKeys
      summary: List keys (members their own, owners their org's, the operator all), newest first
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: The keys (never the secrets)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/KeyList'}
        '401': {$ref: '#/components/responses/KeyUnauthorized'}
        '403': {$ref: '#/components/responses/KeyForbidden'}
        '500': {$ref: '#/components/responses/Internal'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/keys/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, pattern: '^k_[a-z2-7]{16}$'}
    delete:
      operationId: revokeKey
      summary: Revoke a key (idempotent; effective on every server at once via NOTIFY apikey_changed)
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: The revoked key
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiKey'}
        '401': {$ref: '#/components/responses/KeyUnauthorized'}
        '403': {$ref: '#/components/responses/KeyForbidden'}
        '404':
          description: '`key_not_found` (also a key the caller may not manage)'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '500': {$ref: '#/components/responses/Internal'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/orgs:
    post:
      operationId: createOrg
      summary: Create an org (operator only), optionally moving a user in as its owner
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateOrgRequest'}
      responses:
        '201':
          description: The org
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Org'}
        '400':
          description: '`invalid_request` or `invalid_org_name` (2–63 of a-z 0-9 . _ -; `operator` and `user-<n>` are reserved)'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401': {$ref: '#/components/responses/KeyUnauthorized'}
        '403': {$ref: '#/components/responses/KeyForbidden'}
        '404':
          description: '`user_not_found` (owner)'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '409':
          description: '`org_exists`; or `user_in_other_org`: the owner is no longer alone in their personal org (nothing is created)'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '500': {$ref: '#/components/responses/Internal'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/orgs/members:
    get:
      operationId: listMembers
      summary: Members of the caller's org with their roles (owners; the operator with `?org=`)
      description: |
        Owners list their own org. The operator must name the org. Members get 403 `forbidden`; API keys 403
        `permission_denied`. Another org is the same 404 as a missing one.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: org
          in: query
          required: false
          description: The org name (required for the operator)
          schema: {type: string}
      responses:
        '200':
          description: The members, owners first
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MemberList'}
        '400':
          description: '`invalid_request` (the operator did not name an org)'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401': {$ref: '#/components/responses/KeyUnauthorized'}
        '403': {$ref: '#/components/responses/KeyForbidden'}
        '404':
          description: '`org_not_found`'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '500': {$ref: '#/components/responses/Internal'}
        '503': {$ref: '#/components/responses/Unavailable'}
    post:
      operationId: addMember
      summary: Move a user into an org or change their role (operator only; users join through invites)
      description: |
        Operator administration (also `agentbox org add-member`). Owners invite instead
        (`POST /v1/orgs/invites`); a user moves only by accepting. A user belongs to exactly one org. A user who
        is still alone in their personal org `user-<id>` moves into the org; their keys in the old org are revoked
        in the same transaction. A user in any other org is 409 `user_in_other_org`; another user's personal org
        is 409 `personal_org_closed`. Demoting the last owner is 409 `last_owner`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AddMemberRequest'}
      responses:
        '200':
          description: The membership
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Membership'}
        '400':
          description: '`invalid_request` (role, missing org, the reserved org `operator`)'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401': {$ref: '#/components/responses/KeyUnauthorized'}
        '403': {$ref: '#/components/responses/KeyForbidden'}
        '404':
          description: '`user_not_found` or `org_not_found`'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '409':
          description: '`user_in_other_org`, `personal_org_closed` or `last_owner`'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '500': {$ref: '#/components/responses/Internal'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/orgs/invites:
    post:
      operationId: createInvite
      summary: Invite a user into the caller's org (owners, user session only); the user moves only on accept
      description: |
        Invites expire after 7 days. Inviting the same user again renews the invite. A personal org `user-<id>`
        accepts no other members (409 `personal_org_closed`).
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/InviteRequest'}
      responses:
        '201':
          description: The pending invite
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Invite'}
        '400':
          description: '`invalid_request`'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401': {$ref: '#/components/responses/KeyUnauthorized'}
        '403': {$ref: '#/components/responses/KeyForbidden'}
        '404':
          description: '`user_not_found`'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '409':
          description: '`personal_org_closed` or `already_member`'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '500': {$ref: '#/components/responses/Internal'}
        '503': {$ref: '#/components/responses/Unavailable'}
    get:
      operationId: listInvites
      summary: Pending invites of the caller, plus (for owners) those their org sent (user session only)
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Pending, unexpired invites
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InviteList'}
        '401': {$ref: '#/components/responses/KeyUnauthorized'}
        '403': {$ref: '#/components/responses/KeyForbidden'}
        '500': {$ref: '#/components/responses/Internal'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/orgs/invites/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
    delete:
      operationId: deleteInvite
      summary: Decline (the invited user) or revoke (an owner of the org) an invite
      security:
        - cookieAuth: []
      responses:
        '204':
          description: Deleted
        '401': {$ref: '#/components/responses/KeyUnauthorized'}
        '403': {$ref: '#/components/responses/KeyForbidden'}
        '404':
          description: '`invite_not_found` (also expired, or not visible to the caller)'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '500': {$ref: '#/components/responses/Internal'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/orgs/invites/{id}/accept:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
    post:
      operationId: acceptInvite
      summary: Accept an invite (the invited user); moves the user into the org and revokes their keys in the old org
      security:
        - cookieAuth: []
      responses:
        '200':
          description: The new membership
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Membership'}
        '401': {$ref: '#/components/responses/KeyUnauthorized'}
        '403': {$ref: '#/components/responses/KeyForbidden'}
        '404':
          description: '`invite_not_found` (also expired, or another user''s invite)'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '409':
          description: '`user_in_other_org` (the user is no longer alone in their personal org) or `last_owner`'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '500': {$ref: '#/components/responses/Internal'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/orgs/members/{user}:
    parameters:
      - name: user
        in: path
        required: true
        schema: {type: string}
      - name: org
        in: query
        required: false
        description: The org name (required for the operator; an owner defaults to their own org)
        schema: {type: string}
    delete:
      operationId: removeMember
      summary: Remove a member (owners, the operator) or leave the org yourself; they return to their personal org and their keys in this org are revoked
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '204':
          description: Removed
        '400':
          description: '`invalid_request` (operator without org)'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401': {$ref: '#/components/responses/KeyUnauthorized'}
        '403': {$ref: '#/components/responses/KeyForbidden'}
        '404':
          description: '`member_not_found`, `user_not_found` or `org_not_found`'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '409':
          description: '`last_owner` or `personal_org` (a user cannot leave their personal org)'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '500': {$ref: '#/components/responses/Internal'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/limits/{kind}/{id}:
    parameters:
      - {$ref: '#/components/parameters/QuotaKind'}
      - {$ref: '#/components/parameters/QuotaID'}
    get:
      operationId: getLimits
      summary: Rate and concurrency limits of an org, user or key (null = no limit at that level)
      description: |
        Org owners read their org and its users and keys; the operator reads everything. Members and API keys
        cannot (403). Levels of another org answer 404 like ones that do not exist.
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: The limits
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Limits'}
        '400': {$ref: '#/components/responses/QuotaBadRequest'}
        '401': {$ref: '#/components/responses/KeyUnauthorized'}
        '403': {$ref: '#/components/responses/QuotaForbidden'}
        '404': {$ref: '#/components/responses/QuotaNotFound'}
        '500': {$ref: '#/components/responses/Internal'}
        '503': {$ref: '#/components/responses/QuotaUnavailable'}
    put:
      operationId: putLimits
      summary: Replace the limits of an org (operator) or of a user or key (its org's owners, operator)
      description: |
        Every field is replaced; an absent field is null (no limit at that level). A user's or key's value cannot be
        above the same limit of its org (400 `exceeds_org_limit`). Only `rpm` is enforced on the runtime API
        (`POST /sessions`, `/research`, `/sessions/{id}/messages`, `/sessions/{id}/wake`, `/turns/{id}/restore`, `/continue`,
        `/finish`, `/answer`); `max_sandboxes` (org level only, else 400 `unsupported_limit`) is checked when a task of the org
        is admitted to a run slot; `tpm` and `max_streams` are for the model API.
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LimitsRequest'}
      responses:
        '200':
          description: The limits now in effect
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Limits'}
        '400': {$ref: '#/components/responses/QuotaBadRequest'}
        '401': {$ref: '#/components/responses/KeyUnauthorized'}
        '403': {$ref: '#/components/responses/QuotaForbidden'}
        '404': {$ref: '#/components/responses/QuotaNotFound'}
        '500': {$ref: '#/components/responses/Internal'}
        '503': {$ref: '#/components/responses/QuotaUnavailable'}
  /v1/budgets/{kind}/{id}:
    parameters:
      - {$ref: '#/components/parameters/QuotaKind'}
      - {$ref: '#/components/parameters/QuotaID'}
    get:
      operationId: getBudget
      summary: Monthly money budget and usage of an org, user or key (UTC month)
      description: |
        Usage counts every Gateway call made by the level's sandboxes: reserved (in flight), spent (settled) and
        unknown (outcome unknown, charged in full). Same authorization as `GET /v1/limits/{kind}/{id}`.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: period
          in: query
          required: false
          description: The month, `YYYY-MM` (default the current UTC month)
          schema: {type: string, pattern: '^[0-9]{4}-[0-9]{2}$'}
      responses:
        '200':
          description: The budget
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Budget'}
        '400': {$ref: '#/components/responses/QuotaBadRequest'}
        '401': {$ref: '#/components/responses/KeyUnauthorized'}
        '403': {$ref: '#/components/responses/QuotaForbidden'}
        '404': {$ref: '#/components/responses/QuotaNotFound'}
        '500': {$ref: '#/components/responses/Internal'}
        '503': {$ref: '#/components/responses/QuotaUnavailable'}
    put:
      operationId: putBudget
      summary: Set the monthly budget of an org (operator) or of a user or key (its org's owners, operator)
      description: |
        Sets the limit of the current UTC month; later months start with the same limit. null means unlimited.
        A user's or key's limit cannot be above its org's limit for the month (400 `exceeds_org_limit`), and no
        limit can be below the month's usage including reservations (409 `budget_below_usage`).
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BudgetRequest'}
      responses:
        '200':
          description: The budget with its new limit
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Budget'}
        '400': {$ref: '#/components/responses/QuotaBadRequest'}
        '401': {$ref: '#/components/responses/KeyUnauthorized'}
        '403': {$ref: '#/components/responses/QuotaForbidden'}
        '404': {$ref: '#/components/responses/QuotaNotFound'}
        '409':
          description: '`budget_below_usage`: the limit is below this month''s usage (spent + reserved + unknown)'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '500': {$ref: '#/components/responses/Internal'}
        '503': {$ref: '#/components/responses/QuotaUnavailable'}
  /v1/usage:
    get:
      operationId: getUsage
      summary: Daily usage (requests, tokens, known and unknown cost) grouped by day, model, key, user, org or source
      description: |
        Read from `usage_daily`, which a periodic rollup fills from settled budget holds (`as_of` is the time of the
        last rollup). Cost is in micro-USD: `cost_micro` is known cost, `unknown_micro` was charged at the estimate
        because the outcome was unknown. Source `model_api` is `/v1/chat/completions` and `/v1/messages`; source
        `runtime` is the calls made by sandboxes (tokens are not recorded for them). Members see only their own
        usage, owners their org's, the operator every org (or the one in `?org=`). API keys get 403
        `permission_denied`. An org, user or key the caller cannot see is the same 404 as a missing one.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - {name: from, in: query, required: false, description: 'First UTC day, `YYYY-MM-DD` (default the first day of this month)', schema: {type: string}}
        - {name: to, in: query, required: false, description: 'Last UTC day, inclusive (default today); at most 366 days after `from`', schema: {type: string}}
        - {name: group_by, in: query, required: false, description: 'Comma-separated dimensions among `day`, `model`, `key`, `user`, `org`, `source` (default `day`)', schema: {type: string}}
        - {name: org, in: query, required: false, description: The org name (the operator; others may only name their own), schema: {type: string}}
        - {name: user, in: query, required: false, description: 'A username of the org, or a former member with usage in it (members may only name themselves)', schema: {type: string}}
        - {name: key, in: query, required: false, description: An API key id the caller can see, schema: {type: string}}
      responses:
        '200':
          description: The grouped rows and their total
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Usage'}
        '400':
          description: '`invalid_request` (dates, range or group_by)'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401': {$ref: '#/components/responses/KeyUnauthorized'}
        '403': {$ref: '#/components/responses/KeyForbidden'}
        '404':
          description: '`org_not_found`, `user_not_found` or `key_not_found` (also one the caller cannot see)'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '500': {$ref: '#/components/responses/Internal'}
        '503': {$ref: '#/components/responses/UsageUnavailable'}
  /v1/bills/{month}:
    parameters:
      - name: month
        in: path
        required: true
        description: 'The UTC month, `YYYY-MM`'
        schema: {type: string}
    get:
      operationId: getBill
      summary: A month's bill for an org (a member's own share for members) with per-model tokens and cost
      description: |
        The month's `usage_daily` rows summed per model and per source, with known and unknown cost apart. Owners get
        their org's bill and members their own share (`username` is set); the operator must name the org with
        `?org=`. Same authorization as `GET /v1/usage`.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - {name: org, in: query, required: false, description: The org name (required for the operator), schema: {type: string}}
        - {name: user, in: query, required: false, description: Only this user's usage (owners and the operator), schema: {type: string}}
        - {name: key, in: query, required: false, description: Only this key's usage, schema: {type: string}}
      responses:
        '200':
          description: The bill
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Bill'}
        '400':
          description: '`invalid_request` (month, or the operator did not name an org)'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401': {$ref: '#/components/responses/KeyUnauthorized'}
        '403': {$ref: '#/components/responses/KeyForbidden'}
        '404':
          description: '`org_not_found`, `user_not_found` or `key_not_found` (also one the caller cannot see)'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '500': {$ref: '#/components/responses/Internal'}
        '503': {$ref: '#/components/responses/UsageUnavailable'}
  /v1/chat/completions:
    post:
      operationId: createChatCompletion
      summary: OpenAI-format chat completion (model API, `--model-api`)
      description: |
        The OpenAI Chat Completions API in front of the configured model routes (model gateway design §7). The
        provider may be OpenAI-compatible (the body is forwarded with only `model` rewritten; streams are forwarded
        event by event) or Anthropic (the request and reply are converted). `stream: true` answers with server-sent
        events. Requires the `models` scope. Rate limits (requests and estimated tokens per minute, concurrent
        streams) and the monthly budget of the key, user and org apply; errors use the OpenAI error object
        (`{"error":{"message","type","param","code"}}`). Not available when the server runs without `--model-api`.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChatCompletionRequest'}
      responses:
        '200':
          description: The completion (JSON), or the stream (`text/event-stream`) when `stream` is true. An error after the stream started is a final `data:` event with an error object.
          headers:
            x-request-id: {schema: {type: string}, description: The model request id (`model_requests.id`)}
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
            text/event-stream:
              schema: {type: string}
        '400': {$ref: '#/components/responses/ModelBadRequest'}
        '401': {$ref: '#/components/responses/ModelError'}
        '403': {$ref: '#/components/responses/ModelError'}
        '404': {$ref: '#/components/responses/ModelError'}
        '429': {$ref: '#/components/responses/ModelTooMany'}
        '500': {$ref: '#/components/responses/ModelError'}
        '502': {$ref: '#/components/responses/ModelError'}
        '503': {$ref: '#/components/responses/ModelError'}
  /v1/messages:
    post:
      operationId: createMessage
      summary: Anthropic-format message (model API, `--model-api`)
      description: |
        The Anthropic Messages API in front of the same model routes; the `anthropic-version` header is accepted and
        echoed. Same rules as `/v1/chat/completions`; errors use the Anthropic error object
        (`{"type":"error","error":{"type","message"}}`).
      security:
        - apiKeyAuth: []
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MessagesRequest'}
      responses:
        '200':
          description: 'The message (JSON), or the event stream when `stream` is true. An error after the stream started is a final `event: error`.'
          headers:
            x-request-id: {schema: {type: string}, description: The model request id (`model_requests.id`)}
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
            text/event-stream:
              schema: {type: string}
        '400': {$ref: '#/components/responses/ModelBadRequest'}
        '401': {$ref: '#/components/responses/ModelError'}
        '403': {$ref: '#/components/responses/ModelError'}
        '404': {$ref: '#/components/responses/ModelError'}
        '429': {$ref: '#/components/responses/ModelTooMany'}
        '500': {$ref: '#/components/responses/ModelError'}
        '502': {$ref: '#/components/responses/ModelError'}
        '503': {$ref: '#/components/responses/ModelError'}
  /v1/models:
    get:
      operationId: listModels
      summary: The logical models (model API, `--model-api`)
      description: The configured logical models some route serves, in OpenAI list format, or in Anthropic format when the `anthropic-version` header is present.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: The model list
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ModelList'}
        '401': {$ref: '#/components/responses/ModelError'}
        '403': {$ref: '#/components/responses/ModelError'}
        '503': {$ref: '#/components/responses/ModelError'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: The operator credential. Required when the server binds a non-loopback address. Never put the token in a URL.
    cookieAuth:
      type: apiKey
      in: cookie
      name: agentbox_session
      description: A user session (accounts enabled), set by `/auth/register` and `/auth/login`. Ignored when an `Authorization` header is present.
    apiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: 'A platform API key `abx_live_<id>_<secret>` (tenancy enabled). The same key is also accepted as `Authorization: Bearer abx_live_...`.'
  parameters:
    QuotaKind:
      name: kind
      in: path
      required: true
      schema: {type: string, enum: [org, user, key]}
    QuotaID:
      name: id
      in: path
      required: true
      description: The org name, the username, or the key id
      schema: {type: string}
    TaskID:
      name: id
      in: path
      required: true
      schema: {type: string}
    ArtifactID:
      name: artifact_id
      in: path
      required: true
      schema: {type: string}
    SessionID:
      name: id
      in: path
      required: true
      schema: {type: string}
    TurnID:
      name: id
      in: path
      required: true
      description: The turn id (= task id)
      schema: {type: string}
  requestBodies:
    Control:
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ControlRequest'}
    SessionWrite:
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/SessionWriteRequest'}
  responses:
    ModelError:
      description: |
        A model API error in the caller's format (design §7.5): `invalid_api_key` (401), `permission_denied` (403, the
        key lacks the `models` scope), `model_not_found` (404), `internal_error` (500), `upstream_error` (502: the
        provider failed), `model_degraded` (503: every provider of the model is unavailable) or `service_unavailable`
        (503: PostgreSQL is unavailable; no model call runs without a budget hold).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ModelErrorBody'}
    ModelBadRequest:
      description: '`invalid_request_error`, or `unsupported_field` naming the field (a feature no provider serving the model can express, `n` other than 1, or `logprobs` without `stream`)'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ModelErrorBody'}
    ModelTooMany:
      description: |
        `rate_limit_exceeded` (requests or tokens per minute, or concurrent streams, of the caller's key, user or org)
        or `insufficient_quota` (the monthly budget of a level is used up; the message names the level). Anthropic
        callers get `rate_limit_error` for both.
      headers:
        Retry-After: {schema: {type: integer}, description: Seconds until a request can succeed (rate limits)}
        x-ratelimit-limit-requests: {schema: {type: integer}, description: The most constrained level's request limit per minute}
        x-ratelimit-remaining-requests: {schema: {type: integer}, description: Requests left at that level}
        x-ratelimit-reset-requests: {schema: {type: string}, description: 'Time until that level is full again, e.g. `12s`'}
        x-ratelimit-limit-tokens: {schema: {type: integer}, description: The most constrained level's token limit per minute}
        x-ratelimit-remaining-tokens: {schema: {type: integer}, description: Tokens left at that level}
        x-ratelimit-reset-tokens: {schema: {type: string}, description: Time until that level is full again}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ModelErrorBody'}
    RuntimeRateLimited:
      description: |
        `rate_limit_exceeded`: the requests-per-minute limit of the caller's key, user or org is used up (API key and
        session callers; the operator is never limited). Retry after `Retry-After` seconds.
      headers:
        Retry-After: {schema: {type: integer}, description: Seconds until a request can succeed}
        x-ratelimit-limit-requests: {schema: {type: integer}, description: The most constrained level's limit per minute}
        x-ratelimit-remaining-requests: {schema: {type: integer}, description: Requests left at that level}
        x-ratelimit-reset-requests: {schema: {type: string}, description: 'Time until that level is full again, e.g. `12s`'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    QuotaBadRequest:
      description: '`invalid_request` (kind, body or period); `exceeds_org_limit`: a user''s or key''s value above its org''s; or `unsupported_limit`: `max_sandboxes` on a user or key (it is counted per org only)'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    QuotaForbidden:
      description: '`forbidden` (members; owners setting their own org''s limits), or `permission_denied` (API keys never manage limits or budgets)'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    QuotaNotFound:
      description: '`org_not_found`, `user_not_found` or `key_not_found` (also a level of another org)'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    UsageUnavailable:
      description: '`usage_unavailable` (usage accounting is not enabled), or as for every operation'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    QuotaUnavailable:
      description: '`quota_unavailable` (limits and budgets are not enabled), or as for every operation'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    KeyUnauthorized:
      description: '`unauthorized` (no valid session or Bearer token); or `invalid_api_key`: the API key is malformed, unknown, revoked or expired, or its user or org is disabled'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    KeyForbidden:
      description: '`forbidden` (not open to this caller, or not the caller''s key or org); or `permission_denied`: API keys can never manage keys, members or orgs'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    SessionNotFound:
      description: '`session_not_found` (also another user''s session, an unowned one, and for a user a `closed` one)'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    TurnNotFound:
      description: '`turn_not_found` (also a turn of another user''s session, and a task that is not a turn)'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    SessionsUnavailable:
      description: |
        `sessions_unavailable` (the server has no session worker configured); or, as for every operation,
        `diagnostic_mode`, `ownership_lost`, `store_unavailable`, `contention`, or `commit_unknown`
        (retry with the same request_id)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    TurnControlAccepted:
      description: Control accepted, or the first result of the same request replayed
      content:
        application/json:
          schema: {$ref: '#/components/schemas/TurnControlResult'}
    TurnControlRejected:
      description: |
        `invalid_turn_state` (stop needs `queued` or `running`; continue and finish need `paused`; answer
        needs `awaiting_input`), `session_closed`, `user_task_running` (resuming would exceed one active
        turn or research per user), or `request_conflict`
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    ControlAccepted:
      description: Control intent accepted, or the first result of the same request replayed
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ControlResult'}
    Blob:
      description: |
        The artifact content, streamed from the blob store. Readable with read access; only blobs authorized
        to the task (`scope_blobs`) are served. `Content-Type` is the media type registered with the
        artifact. Active content (anything other than text/plain, text/markdown, application/json, image/png,
        image/jpeg and application/pdf — notably text/html and image/svg+xml) is always sent with
        `Content-Disposition: attachment`. The content is verified while it is sent; if it does not match the
        registered SHA-256 the connection is aborted, so the response is never complete.
      headers:
        ETag:
          description: The quoted SHA-256 of the content (as registered)
          schema: {type: string}
        X-Content-Type-Options:
          description: Always `nosniff`
          schema: {type: string}
        Content-Disposition:
          description: '`attachment; filename=...` for active content; absent for the inline-safe types'
          schema: {type: string}
      content:
        '*/*':
          schema: {type: string, format: binary}
    ArtifactNotFound:
      description: '`task_not_found`; or `artifact_not_found`: no such artifact or version in the task, or it is `internal` (indistinguishable from missing)'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    BlobUnavailable:
      description: '`internal`; or `blob_unavailable`: the registered content cannot be read from the blob store'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    BadRequest:
      description: '`invalid_request`: malformed body, missing request_id or invalid parameter; `invalid_limits` (POST /tasks): limits that can never fit the configured capacity, or max_run_time_ms not a positive integer within the server cap (omitted max_run_time_ms is filled with the default and stored with the task)'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Unauthorized:
      description: '`unauthorized`: missing or wrong Bearer token, or (accounts enabled) no valid session'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Forbidden:
      description: '`forbidden_host` or `forbidden_origin`: Host or Origin is not in the allowlist; or `forbidden` (accounts enabled): the operation is not open to this kind of caller (operator-only for a user, session-only for the operator)'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    RateLimited:
      description: '`rate_limited`: too many attempts from this client IP'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    NotFound:
      description: '`task_not_found` (for a user also: another user''s task or an unowned task)'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Conflict:
      description: '`request_conflict`: request_id already used with different content'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    ControlRejected:
      description: |
        `request_conflict`; or the control is rejected by the latest task facts:
        `task_ended` (task is terminal), `cancel_pending` (an accepted cancel cannot be overridden),
        `not_paused` (resume requires a paused task)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Internal:
      description: '`internal`'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Unavailable:
      description: |
        `diagnostic_mode`, `ownership_lost`, `store_unavailable`, `contention`, or `commit_unknown`
        (retry with the same request_id)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
  schemas:
    ChatCompletionRequest:
      type: object
      description: An OpenAI Chat Completions request (see the OpenAI API reference); `model` is a logical model of this server.
      required: [model, messages]
      additionalProperties: true
      properties:
        model: {type: string}
        messages: {type: array, items: {type: object, additionalProperties: true}}
        stream: {type: boolean}
        max_tokens: {type: integer}
        tools: {type: array, items: {type: object, additionalProperties: true}}
    MessagesRequest:
      type: object
      description: An Anthropic Messages request (see the Anthropic API reference); `model` is a logical model of this server.
      required: [model, messages, max_tokens]
      additionalProperties: true
      properties:
        model: {type: string}
        max_tokens: {type: integer}
        messages: {type: array, items: {type: object, additionalProperties: true}}
        system: {}
        stream: {type: boolean}
        tools: {type: array, items: {type: object, additionalProperties: true}}
    ModelErrorBody:
      description: 'OpenAI: `{"error":{"message","type","param","code"}}`; Anthropic: `{"type":"error","error":{"type","message"}}`'
      type: object
      additionalProperties: true
      properties:
        type: {type: string}
        error:
          type: object
          additionalProperties: true
          properties:
            message: {type: string}
            type: {type: string}
            code: {type: string}
            param: {type: string, nullable: true}
    ModelList:
      type: object
      description: 'OpenAI: `{"object":"list","data":[{"id","object":"model","created","owned_by"}]}`; Anthropic: `{"data":[{"type":"model","id","display_name","created_at"}],"has_more","first_id","last_id"}`'
      required: [data]
      additionalProperties: true
      properties:
        object: {type: string}
        data:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              id: {type: string}
              object: {type: string}
              type: {type: string}
        has_more: {type: boolean}
    LimitsRequest:
      type: object
      additionalProperties: false
      properties:
        rpm: {type: integer, nullable: true, minimum: 0, maximum: 2147483647, description: Requests per minute}
        tpm: {type: integer, nullable: true, minimum: 0, maximum: 2147483647, description: Tokens per minute (model API)}
        max_sandboxes: {type: integer, nullable: true, minimum: 0, maximum: 2147483647, description: Concurrent sandboxes of the org (checked at admission)}
        max_streams: {type: integer, nullable: true, minimum: 0, maximum: 2147483647, description: Concurrent model streams (model API)}
    Limits:
      type: object
      required: [kind, id, rpm, tpm, max_sandboxes, max_streams]
      properties:
        kind: {type: string, enum: [org, user, key]}
        id: {type: string}
        rpm: {type: integer, nullable: true}
        tpm: {type: integer, nullable: true}
        max_sandboxes: {type: integer, nullable: true}
        max_streams: {type: integer, nullable: true}
    BudgetRequest:
      type: object
      additionalProperties: false
      required: [limit_micro]
      properties:
        limit_micro: {type: integer, nullable: true, minimum: 0, description: Monthly limit in micro-USD; null is unlimited}
    Budget:
      type: object
      required: [kind, id, period, limit_micro, reserved_micro, spent_micro, unknown_micro, available_micro]
      properties:
        kind: {type: string, enum: [org, user, key]}
        id: {type: string}
        period: {type: string, description: 'The UTC month, `YYYY-MM`'}
        limit_micro: {type: integer, nullable: true, description: null is unlimited}
        reserved_micro: {type: integer}
        spent_micro: {type: integer}
        unknown_micro: {type: integer}
        available_micro: {type: integer, nullable: true, description: limit − spent − reserved − unknown (null when unlimited)}
    Me:
      type: object
      required: [operator, scopes]
      properties:
        operator: {type: boolean}
        username: {type: string, description: Absent for the operator}
        org:
          type: object
          properties:
            id: {type: integer, format: int64}
            name: {type: string}
        role: {type: string, enum: [owner, member]}
        scopes:
          type: array
          items: {type: string, enum: [runtime, models]}
        key_id: {type: string, description: Present when the caller authenticated with an API key}
    ApiKey:
      type: object
      required: [id, name, org_id, username, scopes, created_at]
      properties:
        id: {type: string, pattern: '^k_[a-z2-7]{16}$'}
        name: {type: string}
        org_id: {type: integer, format: int64}
        username: {type: string}
        scopes:
          type: array
          items: {type: string, enum: [runtime, models]}
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        revoked_at: {type: string, format: date-time}
        last_used_at: {type: string, format: date-time, description: Updated at most once a minute}
    CreatedKey:
      allOf:
        - {$ref: '#/components/schemas/ApiKey'}
        - type: object
          required: [key]
          properties:
            key: {type: string, description: 'The full key `abx_live_<id>_<secret>`, returned only here'}
    KeyList:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items: {$ref: '#/components/schemas/ApiKey'}
    CreateKeyRequest:
      type: object
      additionalProperties: false
      required: [name, scopes]
      properties:
        name: {type: string, minLength: 1, maxLength: 64}
        scopes:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string, enum: [runtime, models]}
        expires_at: {type: string, format: date-time}
        username: {type: string, description: 'Operator only: the user the key is for'}
    Org:
      type: object
      required: [id, name, disabled, created_at, members]
      properties:
        id: {type: integer, format: int64}
        name: {type: string}
        disabled: {type: boolean}
        created_at: {type: string, format: date-time}
        members: {type: integer, format: int64}
        owner: {$ref: '#/components/schemas/Membership'}
    CreateOrgRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string}
        owner: {type: string, description: A username still alone in their personal org}
    UsageTotals:
      type: object
      required: [requests, prompt_tokens, completion_tokens, cost_micro, unknown_micro]
      properties:
        requests: {type: integer}
        prompt_tokens: {type: integer}
        completion_tokens: {type: integer}
        cost_micro: {type: integer, description: Known cost in micro-USD (settled)}
        unknown_micro: {type: integer, description: Cost charged at the estimate because the outcome was unknown}
    UsageRow:
      allOf:
        - {$ref: '#/components/schemas/UsageTotals'}
        - type: object
          description: The dimensions that were grouped by are present
          properties:
            day: {type: string, description: '`YYYY-MM-DD` (UTC)'}
            org_id: {type: integer, format: int64}
            org: {type: string}
            username: {type: string}
            key_id: {type: string}
            key_name: {type: string}
            model: {type: string, description: Empty when the request's record is missing}
            source: {type: string, enum: [runtime, model_api]}
    Usage:
      type: object
      required: [from, to, group_by, rows, total, as_of, filter]
      properties:
        from: {type: string}
        to: {type: string}
        group_by:
          type: array
          items: {type: string, enum: [day, org, user, key, model, source]}
        rows:
          type: array
          items: {$ref: '#/components/schemas/UsageRow'}
        total: {$ref: '#/components/schemas/UsageTotals'}
        as_of: {type: string, format: date-time, nullable: true, description: Time of the last rollup (null before the first)}
        filter: {$ref: '#/components/schemas/UsageFilter'}
    UsageFilter:
      type: object
      description: The filters that were applied (the caller's visibility and the query parameters)
      properties:
        org: {type: string, description: Absent when every org is included (operator)}
        username: {type: string, description: Only this user's usage (a member's own, or `?user=`)}
        key_id: {type: string, description: Only this key's usage (`?key=`)}
    BillLine:
      allOf:
        - {$ref: '#/components/schemas/UsageTotals'}
        - type: object
          required: [model, total_micro]
          properties:
            model: {type: string}
            total_micro: {type: integer, description: cost_micro + unknown_micro}
    BillSource:
      allOf:
        - {$ref: '#/components/schemas/UsageTotals'}
        - type: object
          required: [source, total_micro]
          properties:
            source: {type: string, enum: [runtime, model_api]}
            total_micro: {type: integer}
    Bill:
      type: object
      required: [month, org, models, sources, total, as_of, filter]
      properties:
        month: {type: string}
        org:
          type: object
          required: [id, name]
          properties:
            id: {type: integer, format: int64}
            name: {type: string}
        username: {type: string, description: 'Only this user''s share: a member''s own bill, or `?user=`'}
        key_id: {type: string, description: 'Only this key''s share (`?key=`)'}
        models:
          type: array
          items: {$ref: '#/components/schemas/BillLine'}
        sources:
          type: array
          items: {$ref: '#/components/schemas/BillSource'}
        total: {$ref: '#/components/schemas/BillLine'}
        as_of: {type: string, format: date-time, nullable: true}
        filter: {$ref: '#/components/schemas/UsageFilter'}
    MemberList:
      type: object
      required: [org, members]
      properties:
        org:
          type: object
          required: [id, name]
          properties:
            id: {type: integer, format: int64}
            name: {type: string}
        members:
          type: array
          items: {$ref: '#/components/schemas/Membership'}
    Membership:
      type: object
      required: [org_id, org, username, role]
      properties:
        org_id: {type: integer, format: int64}
        org: {type: string}
        username: {type: string}
        role: {type: string, enum: [owner, member]}
    AddMemberRequest:
      type: object
      additionalProperties: false
      required: [username, role, org]
      properties:
        username: {type: string}
        role: {type: string, enum: [owner, member]}
        org: {type: string, description: The org name}
    InviteRequest:
      type: object
      additionalProperties: false
      required: [username, role]
      properties:
        username: {type: string}
        role: {type: string, enum: [owner, member]}
    Invite:
      type: object
      required: [id, org_id, org, username, role, invited_by, created_at, expires_at]
      properties:
        id: {type: string, pattern: '^inv_[a-z2-7]{16}$'}
        org_id: {type: integer, format: int64}
        org: {type: string}
        username: {type: string}
        role: {type: string, enum: [owner, member]}
        invited_by: {type: string}
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
    InviteList:
      type: object
      required: [invites]
      properties:
        invites:
          type: array
          items: {$ref: '#/components/schemas/Invite'}
    Error:
      type: object
      required: [code, message]
      properties:
        code: {type: string}
        message: {type: string}
    ServerInfo:
      type: object
      required: [build, config_version]
      properties:
        build:
          type: object
          nullable: true
          additionalProperties: {type: string}
          description: module_version, go, vcs.revision, vcs.time, vcs.modified (absent fields are omitted)
        config_version: {type: string}
        template: {type: string, description: Rootfs template of task environments}
        worker_argv: {type: array, items: {type: string}}
        session_worker_argv: {type: array, items: {type: string}}
        models:
          type: object
          properties:
            default: {type: string}
            declared: {type: array, items: {type: string}}
            user_orchestrator: {type: string}
            user_worker: {type: string}
        search_provider: {type: string}
        upstream_fingerprint: {type: string, description: 'First 16 hex digits of the sha256 of the model and search upstream configuration (addresses, models, prices, max_tokens cap); never contains keys'}
        model_routes: {type: array, items: {type: string}, description: 'Provider routes of the model fallback chain in priority order (primary first); absent with a single provider'}
        accounts: {type: boolean}
        sessions: {type: boolean}
        worker_subruns: {type: boolean}
        exec:
          type: object
          properties:
            enabled: {type: boolean}
            slots: {type: integer}
            image_digest: {type: string}
    Status:
      type: object
      required: [mode]
      properties:
        mode: {type: string, enum: [normal, diagnostic, ownership_lost]}
        cache:
          type: object
          description: >-
            Gateway shared-cache counters since server start (spec §11.5); absent when the cache is
            off (no --redis-addr, or --cache=off).
          properties:
            hit: {type: integer}
            miss: {type: integer}
            bypass: {type: integer}
            coalesced: {type: integer}
            error: {type: integer}
            breaker_open: {type: integer}
            integrity_failure: {type: integer}
    Credentials:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: {type: string, minLength: 3, maxLength: 32, pattern: '^[A-Za-z0-9_.-]+$'}
        password: {type: string, minLength: 8, maxLength: 128, description: "Registration requires 8–16 characters with at least two of digits, uppercase and lowercase letters; login accepts any stored password"}
    User:
      type: object
      required: [username, role]
      properties:
        username: {type: string}
        role: {type: string, enum: [user, admin]}
    ResearchRequest:
      type: object
      additionalProperties: false
      required: [request_id, topic]
      properties:
        request_id: {type: string, minLength: 1, maxLength: 128}
        topic: {type: string, minLength: 1, maxLength: 500, description: Trimmed of surrounding whitespace before validation}
    CreateTaskRequest:
      type: object
      additionalProperties: false
      required: [request_id, spec]
      properties:
        request_id: {type: string, minLength: 1, maxLength: 128}
        session_id: {type: string, minLength: 1, description: 'Create the task as a turn of this session (operator path; see createTask)'}
        spec: {type: object, description: Task specification passed to the worker}
        limits: {type: object, description: Resource limits for the task}
    CreateTaskResult:
      type: object
      required: [task_id]
      properties:
        task_id: {type: string}
    ControlRequest:
      type: object
      additionalProperties: false
      required: [request_id]
      properties:
        request_id: {type: string, minLength: 1, maxLength: 128}
        reason: {type: string}
    ControlResult:
      type: object
      required: [task_id, control_version]
      properties:
        task_id: {type: string}
        control_version: {type: integer, format: int64}
    Task:
      type: object
      required: [task_id, status, desired, control_version, applied_control_version, attempts_total, created_at]
      properties:
        task_id: {type: string}
        status: {type: string}
        status_reason: {type: string}
        current_attempt_id: {type: string, description: Operator view only; omitted for users}
        desired: {type: string, enum: [run, pause, cancel]}
        control_version: {type: integer, format: int64}
        applied_control_version: {type: integer, format: int64}
        attempts_total: {type: integer, format: int64}
        topic: {type: string, description: "The spec's `topic` field (the research topic); omitted when the spec has none"}
        created_at: {type: string, format: date-time}
    TaskList:
      type: object
      required: [tasks]
      properties:
        tasks:
          type: array
          items: {$ref: '#/components/schemas/Task'}
        next: {type: string, description: Cursor for the next page; absent on the last page}
    Event:
      type: object
      required: [task_seq, source, type, ts]
      properties:
        task_seq: {type: integer, format: int64}
        attempt_id: {type: string}
        source: {type: string}
        type: {type: string}
        worker_seq: {type: integer, format: int64}
        payload: {type: object}
        ts: {type: string, format: date-time}
    Attempt:
      type: object
      properties:
        attempt_id: {type: string}
        attempt_no: {type: integer, format: int64}
        status: {type: string}
        outcome_class: {type: string}
        exit_code: {type: integer, format: int64}
        exit_signal: {type: integer, format: int64}
        oom_kill_delta: {type: integer, format: int64}
        platform_killed: {type: boolean}
        env_id: {type: string}
        env_status: {type: string}
        cleanup_state: {type: string}
        stopped_at: {type: string, format: date-time}
        cleanup_tries: {type: integer, format: int64}
        cleanup_error: {type: string}
    Checkpoint:
      type: object
      properties:
        checkpoint_id: {type: string}
        step_id: {type: string}
        attempt_id: {type: string}
        commit_seq: {type: integer, format: int64}
        committed_at: {type: string, format: date-time}
    CallTry:
      type: object
      description: One host-managed try of a Gateway call (audit metadata only)
      required: [try_no, attempt_id, state, latency_ms, cost_micro]
      properties:
        try_no: {type: integer, format: int64}
        attempt_id: {type: string}
        env_id: {type: string}
        state: {type: string, enum: [in_flight, settled]}
        outcome: {type: string, enum: [ok, retryable, fatal, unknown]}
        latency_ms: {type: integer, format: int64}
        cost_micro: {type: integer, format: int64, description: Settled cost in micro-USD (ok tries only)}
        error: {type: string}
        queue_ms: {type: integer, format: int64, description: Exec tries only — time spent waiting for an exec slot}
        wall_ms: {type: integer, format: int64, description: Exec tries only — wall time of the run}
        cpu_usec: {type: integer, format: int64, description: Exec tries only — measured CPU (cpu.stat usage_usec); omitted when unknown (charged at the full reservation)}
        exec_started_at: {type: string, format: date-time, description: Exec tries only — when the host marked the exec as starting; omitted if it never started}
        provider: {type: string, description: "Model provider chain only — the provider route that ran this try (primary, backup, …); omitted with a single provider"}
        skipped: {type: string, description: "Model provider chain only — providers passed over before this try as name:reason (circuit_open, tried, model_not_served), comma-separated"}
        hedge: {type: boolean, description: Model provider chain only — true for the second, concurrent leg of a hedged request}
        hedge_lost: {type: boolean, description: "Model provider chain only — this try was cancelled because the other leg of a hedged pair produced the decisive result (error keeps the try's own code)"}
    Call:
      type: object
      description: A Gateway logical call (journal entry). Metadata only — no request or response bodies, prompts or credentials.
      required: [call_id, endpoint, state, source, first_attempt_id, tries_used, cost_charged_micro, possible_external_duplicate, created_at, deadline_at, tries]
      properties:
        call_id: {type: string}
        endpoint: {type: string}
        model: {type: string, description: The resolved model the call used (from the journal). Omitted for non-chat calls.}
        subrun_id: {type: string, description: The sub-run the call is attributed to (X-Agentbox-Subrun). Omitted for root calls.}
        state: {type: string, enum: [resolving, in_flight, completed, failed, unknown]}
        source: {type: string}
        first_attempt_id: {type: string}
        tries_used: {type: integer, format: int64}
        cost_charged_micro: {type: integer, format: int64}
        upstream_request_id: {type: string}
        result_ref: {type: string, description: sha256 of the result blob (completed calls only)}
        fail_reason: {type: string}
        supersedes_call_id: {type: string}
        supersede_reason: {type: string}
        possible_external_duplicate: {type: boolean}
        created_at: {type: string, format: date-time}
        deadline_at: {type: string, format: date-time}
        tries:
          type: array
          items: {$ref: '#/components/schemas/CallTry'}
    PinnedOutput:
      type: object
      description: An output pinned when the result was processed; version and sha256 are absent if the artifact was never saved
      required: [artifact_id]
      properties:
        artifact_id: {type: string}
        version: {type: integer, format: int64}
        sha256: {type: string}
    Result:
      type: object
      required: [summary, outputs]
      properties:
        summary: {type: string}
        outputs:
          type: array
          items: {$ref: '#/components/schemas/PinnedOutput'}
    TaskBudget:
      type: object
      description: The task-layer ledger (the total of the two-layer cost, spec §9.6). Amounts in micro-USD.
      required: [limit_micro, reserved_micro, spent_micro, unknown_micro, tool_calls_used]
      properties:
        limit_micro: {type: integer, format: int64}
        reserved_micro: {type: integer, format: int64}
        spent_micro: {type: integer, format: int64}
        unknown_micro: {type: integer, format: int64}
        tool_call_limit: {type: integer, format: int64, description: Per-task web_search + web_fetch limit; omitted when unlimited}
        tool_calls_used: {type: integer, format: int64}
    Subrun:
      type: object
      description: |
        One sub-run of the task (operator inspect only, spec §15.4): state machine status and timeline, failure or
        cancel reason, and the sub-run-layer ledger (micro-USD). `cap_micro` is omitted when the sub-run layer only
        attributes spend without a cap. `calls` counts the Gateway calls with this `subrun_id`.
      required: [subrun_id, parent_step_id, status, started_at, deadline_at, reserved_micro, spent_micro, unknown_micro, calls]
      properties:
        subrun_id: {type: string}
        parent_step_id: {type: string}
        status: {type: string, enum: [started, end_proposed, cancel_requested, completed, cancelled, failed, timed_out]}
        started_at: {type: string, format: date-time}
        ended_at: {type: string, format: date-time, description: Set once the sub-run is terminal}
        deadline_at: {type: string, format: date-time}
        cancel_reason: {type: string, description: 'deadline, orchestrator, task_cancel or policy'}
        failure_reason: {type: string, description: 'Worker reason (≤ 256 bytes), or task_cancel, not_completed_at_result, checkpoint_failed'}
        cap_micro: {type: integer, format: int64}
        reserved_micro: {type: integer, format: int64}
        spent_micro: {type: integer, format: int64}
        unknown_micro: {type: integer, format: int64}
        calls: {type: integer}
    Inspection:
      type: object
      required: [task, attempts, checkpoints, calls, subruns]
      properties:
        task: {$ref: '#/components/schemas/Task'}
        attempts:
          type: array
          items: {$ref: '#/components/schemas/Attempt'}
        checkpoints:
          type: array
          items: {$ref: '#/components/schemas/Checkpoint'}
        calls:
          type: array
          items: {$ref: '#/components/schemas/Call'}
        budget: {$ref: '#/components/schemas/TaskBudget'}
        subruns:
          type: array
          description: Sub-runs ordered by start time, then ID; empty for tasks without sub-runs
          items: {$ref: '#/components/schemas/Subrun'}
    SessionErrorCode:
      type: string
      description: |
        Error codes of the session operations (`Error.code`). Not-found: `session_not_found`,
        `turn_not_found`, `not_found` (raw downloads). 409: `session_closed` (the session is being
        deleted), `turn_in_progress` (a turn is queued, running or stopping; stop it first),
        `invalid_turn_state` (the control does not fit the turn's status), `not_restorable`,
        `user_task_running`, `request_conflict`. 400: `invalid_request`, `invalid_text`, `invalid_title`,
        `invalid_answers`, `invalid_cursor`. 503: `sessions_unavailable`. Also `unauthorized` and
        `forbidden` as for every operation.
      enum: [session_not_found, turn_not_found, not_found, session_closed, turn_in_progress, invalid_turn_state, not_restorable, user_task_running, request_conflict, invalid_request, invalid_text, invalid_title, invalid_answers, invalid_cursor, sessions_unavailable, unauthorized, forbidden]
    SessionWriteRequest:
      type: object
      additionalProperties: false
      required: [request_id]
      properties:
        request_id: {type: string, minLength: 1, maxLength: 128}
    CreateSessionRequest:
      type: object
      additionalProperties: false
      required: [request_id]
      properties:
        request_id: {type: string, minLength: 1, maxLength: 128}
        title: {type: string, maxLength: 80, description: 'Trimmed of surrounding whitespace; omitted or empty means the automatic title (the first 40 characters of the first message)'}
    RenameSessionRequest:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title: {type: string, minLength: 1, maxLength: 80, description: Trimmed of surrounding whitespace before validation}
    Session:
      type: object
      required: [session_id, title, state, last_active_at, created_at]
      properties:
        session_id: {type: string}
        title: {type: string, description: Empty until the first message or a rename sets it}
        state: {type: string, enum: [idle, running, frozen, evicted, restoring, closing, closed], description: 'User-facing state: the internal `creating` and `quiescing` show as `idle`, `evicting` as `frozen`. A message to a `frozen` or `evicted` session wakes it.'}
        last_active_at: {type: string, format: date-time}
        created_at: {type: string, format: date-time}
        owner: {type: string, description: Operator view only — the owner's username}
        internal_state: {type: string, description: 'Operator view only — the stored lifecycle status (creating, idle, running, quiescing, frozen, evicting, evicted, restoring, closing, closed)'}
    SessionList:
      type: object
      required: [sessions]
      properties:
        sessions:
          type: array
          items: {$ref: '#/components/schemas/Session'}
        next: {type: string, description: Cursor for the next page; absent on the last page}
    MessageRequest:
      type: object
      additionalProperties: false
      required: [request_id, text, deep_research]
      properties:
        request_id: {type: string, minLength: 1, maxLength: 128}
        text: {type: string, minLength: 1, maxLength: 4000, description: Trimmed of surrounding whitespace before validation (1–4000 characters)}
        deep_research: {type: boolean, description: Force the research path (otherwise the model decides between answering and researching)}
    MessageResult:
      type: object
      required: [turn_id, turn_index]
      properties:
        turn_id: {type: string}
        turn_index: {type: integer, format: int64}
        superseded_turn_id: {type: string, description: The paused turn that this turn superseded (cancelled with reason `superseded`; restorable)}
    Answer:
      type: object
      additionalProperties: false
      required: [question_id]
      description: Exactly one of `choice` (one of the question's options) and `other` (free text) is set.
      properties:
        question_id: {type: string, minLength: 1, description: 'The `questions[].id` of the `ask_user` event'}
        choice: {type: string}
        other: {type: string}
    AnswerRequest:
      type: object
      additionalProperties: false
      required: [request_id, answers]
      properties:
        request_id: {type: string, minLength: 1, maxLength: 128}
        answers:
          type: array
          minItems: 1
          maxItems: 3
          items: {$ref: '#/components/schemas/Answer'}
    TurnControlResult:
      type: object
      required: [turn_id, control_version]
      properties:
        turn_id: {type: string}
        control_version: {type: integer, format: int64}
    ReportRef:
      type: object
      required: [artifact_id, version]
      properties:
        artifact_id: {type: string}
        version: {type: integer, format: int64}
    Turn:
      type: object
      required: [turn_id, turn_index, text, deep_research, status, restorable, tool_calls_used, tool_call_limit, created_at]
      properties:
        turn_id: {type: string, description: The turn's task id}
        turn_index: {type: integer, format: int64}
        text: {type: string, description: The user's message}
        deep_research: {type: boolean}
        status: {type: string, enum: [queued, running, stopping, paused, awaiting_input, succeeded, failed, cancelled], description: '`stopping` is the internal pausing or cancelling; `awaiting_input` is a pause waiting for `/answer`'}
        status_reason: {type: string, description: 'For example `superseded` for a turn cancelled by a newer message'}
        route: {type: string, enum: [answer, research], description: The path the turn took; absent until decided}
        restored_from_turn_id: {type: string}
        restorable: {type: boolean, description: 'True for a cancelled turn with a checkpoint (`POST /turns/{id}/restore`)'}
        tool_calls_used: {type: integer, format: int64, description: web_search and web_fetch calls counted against the turn's budget}
        tool_call_limit: {type: integer, format: int64}
        summary: {type: string, description: The reply text of a succeeded turn}
        report: {$ref: '#/components/schemas/ReportRef'}
        user_message: {type: string, description: 'User-facing explanation of a failure ("模型服务暂时不可用，请重试")'}
        created_at: {type: string, format: date-time}
    TurnList:
      type: object
      required: [turns]
      properties:
        turns:
          type: array
          items: {$ref: '#/components/schemas/Turn'}
    SessionEventType:
      type: string
      description: |
        `session_state`, `turn_created`, `turn_status` and `turn_result` come from the host; the others are
        worker progress kinds (`progress.kind` is the type and `progress.data` the data, filtered to the
        schema's fields). `internal` is sent to the operator only.
      enum: [session_state, turn_created, turn_status, route, skill_read, thinking, ask_user, todo_updated, subtopic, tool_call, tool_result, budget, assistant_delta, report_ready, turn_stopped, turn_result, internal]
    SessionEventInternal:
      type: object
      description: Operator view only — the stored record the event was mapped from, unredacted.
      required: [source, type, payload]
      properties:
        source: {type: string, enum: [host, worker, session]}
        type: {type: string}
        attempt_id: {type: string}
        task_seq: {type: integer, format: int64}
        payload: {type: object}
    SessionEventBase:
      type: object
      required: [seq, ts]
      properties:
        seq: {type: integer, format: int64, description: Session-wide sequence (the SSE id)}
        turn_id: {type: string, description: The turn the event belongs to; absent for session lifecycle events}
        ts: {type: string, format: date-time}
        internal: {$ref: '#/components/schemas/SessionEventInternal'}
    SessionEvent:
      description: One event of the session stream, discriminated by `type`.
      oneOf:
        - {$ref: '#/components/schemas/SessionStateEvent'}
        - {$ref: '#/components/schemas/TurnCreatedEvent'}
        - {$ref: '#/components/schemas/TurnStatusEvent'}
        - {$ref: '#/components/schemas/RouteEvent'}
        - {$ref: '#/components/schemas/SkillReadEvent'}
        - {$ref: '#/components/schemas/ThinkingEvent'}
        - {$ref: '#/components/schemas/AskUserEvent'}
        - {$ref: '#/components/schemas/TodoUpdatedEvent'}
        - {$ref: '#/components/schemas/SubtopicEvent'}
        - {$ref: '#/components/schemas/ToolCallEvent'}
        - {$ref: '#/components/schemas/ToolResultEvent'}
        - {$ref: '#/components/schemas/BudgetEvent'}
        - {$ref: '#/components/schemas/AssistantDeltaEvent'}
        - {$ref: '#/components/schemas/ReportReadyEvent'}
        - {$ref: '#/components/schemas/TurnStoppedEvent'}
        - {$ref: '#/components/schemas/TurnResultEvent'}
        - {$ref: '#/components/schemas/InternalEvent'}
      discriminator:
        propertyName: type
        mapping:
          session_state: '#/components/schemas/SessionStateEvent'
          turn_created: '#/components/schemas/TurnCreatedEvent'
          turn_status: '#/components/schemas/TurnStatusEvent'
          route: '#/components/schemas/RouteEvent'
          skill_read: '#/components/schemas/SkillReadEvent'
          thinking: '#/components/schemas/ThinkingEvent'
          ask_user: '#/components/schemas/AskUserEvent'
          todo_updated: '#/components/schemas/TodoUpdatedEvent'
          subtopic: '#/components/schemas/SubtopicEvent'
          tool_call: '#/components/schemas/ToolCallEvent'
          tool_result: '#/components/schemas/ToolResultEvent'
          budget: '#/components/schemas/BudgetEvent'
          assistant_delta: '#/components/schemas/AssistantDeltaEvent'
          report_ready: '#/components/schemas/ReportReadyEvent'
          turn_stopped: '#/components/schemas/TurnStoppedEvent'
          turn_result: '#/components/schemas/TurnResultEvent'
          internal: '#/components/schemas/InternalEvent'
    SessionStateEvent:
      allOf:
        - {$ref: '#/components/schemas/SessionEventBase'}
        - type: object
          required: [type, data]
          properties:
            type: {type: string, enum: [session_state]}
            data: {$ref: '#/components/schemas/SessionStateData'}
    TurnCreatedEvent:
      allOf:
        - {$ref: '#/components/schemas/SessionEventBase'}
        - type: object
          required: [type, data]
          properties:
            type: {type: string, enum: [turn_created]}
            data: {$ref: '#/components/schemas/TurnCreatedData'}
    TurnStatusEvent:
      allOf:
        - {$ref: '#/components/schemas/SessionEventBase'}
        - type: object
          required: [type, data]
          properties:
            type: {type: string, enum: [turn_status]}
            data: {$ref: '#/components/schemas/TurnStatusData'}
    RouteEvent:
      allOf:
        - {$ref: '#/components/schemas/SessionEventBase'}
        - type: object
          required: [type, data]
          properties:
            type: {type: string, enum: [route]}
            data: {$ref: '#/components/schemas/RouteData'}
    SkillReadEvent:
      allOf:
        - {$ref: '#/components/schemas/SessionEventBase'}
        - type: object
          required: [type, data]
          properties:
            type: {type: string, enum: [skill_read]}
            data: {$ref: '#/components/schemas/SkillReadData'}
    ThinkingEvent:
      allOf:
        - {$ref: '#/components/schemas/SessionEventBase'}
        - type: object
          required: [type, data]
          properties:
            type: {type: string, enum: [thinking]}
            data: {$ref: '#/components/schemas/ThinkingData'}
    AskUserEvent:
      allOf:
        - {$ref: '#/components/schemas/SessionEventBase'}
        - type: object
          required: [type, data]
          properties:
            type: {type: string, enum: [ask_user]}
            data: {$ref: '#/components/schemas/AskUserData'}
    TodoUpdatedEvent:
      allOf:
        - {$ref: '#/components/schemas/SessionEventBase'}
        - type: object
          required: [type, data]
          properties:
            type: {type: string, enum: [todo_updated]}
            data: {$ref: '#/components/schemas/TodoUpdatedData'}
    SubtopicEvent:
      allOf:
        - {$ref: '#/components/schemas/SessionEventBase'}
        - type: object
          required: [type, data]
          properties:
            type: {type: string, enum: [subtopic]}
            data: {$ref: '#/components/schemas/SubtopicData'}
    ToolCallEvent:
      allOf:
        - {$ref: '#/components/schemas/SessionEventBase'}
        - type: object
          required: [type, data]
          properties:
            type: {type: string, enum: [tool_call]}
            data: {$ref: '#/components/schemas/ToolCallData'}
    ToolResultEvent:
      allOf:
        - {$ref: '#/components/schemas/SessionEventBase'}
        - type: object
          required: [type, data]
          properties:
            type: {type: string, enum: [tool_result]}
            data: {$ref: '#/components/schemas/ToolResultData'}
    BudgetEvent:
      allOf:
        - {$ref: '#/components/schemas/SessionEventBase'}
        - type: object
          required: [type, data]
          properties:
            type: {type: string, enum: [budget]}
            data: {$ref: '#/components/schemas/BudgetData'}
    AssistantDeltaEvent:
      allOf:
        - {$ref: '#/components/schemas/SessionEventBase'}
        - type: object
          required: [type, data]
          properties:
            type: {type: string, enum: [assistant_delta]}
            data: {$ref: '#/components/schemas/AssistantDeltaData'}
    ReportReadyEvent:
      allOf:
        - {$ref: '#/components/schemas/SessionEventBase'}
        - type: object
          required: [type, data]
          properties:
            type: {type: string, enum: [report_ready]}
            data: {$ref: '#/components/schemas/ReportReadyData'}
    TurnStoppedEvent:
      allOf:
        - {$ref: '#/components/schemas/SessionEventBase'}
        - type: object
          required: [type, data]
          properties:
            type: {type: string, enum: [turn_stopped]}
            data: {$ref: '#/components/schemas/TurnStoppedData'}
    TurnResultEvent:
      allOf:
        - {$ref: '#/components/schemas/SessionEventBase'}
        - type: object
          required: [type, data]
          properties:
            type: {type: string, enum: [turn_result]}
            data: {$ref: '#/components/schemas/TurnResultData'}
    InternalEvent:
      description: Operator view only — a stored record with no user-facing type; see `internal`.
      allOf:
        - {$ref: '#/components/schemas/SessionEventBase'}
        - type: object
          required: [type, data, internal]
          properties:
            type: {type: string, enum: [internal]}
            data: {type: object, description: Always empty}
    SessionStateData:
      type: object
      required: [state]
      properties:
        state: {type: string, enum: [idle, frozen, evicted, restoring, closed]}
        user_message: {type: string, description: 'Set when a restore failed ("会话暂时无法恢复"); the history stays readable'}
    TurnCreatedData:
      type: object
      required: [turn_index, text, deep_research]
      properties:
        turn_index: {type: integer, format: int64}
        text: {type: string}
        deep_research: {type: boolean}
        restored_from_turn_id: {type: string}
    TurnStatusData:
      type: object
      description: Sent when a control is applied, an attempt ends or the turn ends.
      required: [status]
      properties:
        status: {type: string, enum: [queued, running, stopping, paused, awaiting_input, succeeded, failed, cancelled]}
        reason: {type: string, description: 'The status reason, for example `superseded`; absent for `awaiting_input`'}
        user_message: {type: string, description: 'Set for `failed` ("模型服务暂时不可用，请重试")'}
    RouteData:
      type: object
      required: [route, forced]
      properties:
        route: {type: string, enum: [answer, research]}
        forced: {type: boolean, description: True when the user forced research with `deep_research`}
    SkillReadData:
      type: object
      required: [step_id, name]
      properties:
        step_id: {type: string}
        name: {type: string, description: 'The skill name, for example `deep-research`'}
        description: {type: string}
        file: {type: string, description: A reference file of the skill that was read (absent for the skill body)}
    ThinkingData:
      type: object
      required: [step_id, text]
      properties:
        step_id: {type: string}
        text: {type: string, description: The model's reasoning shown to the user (≤ 600 characters)}
        raw: {$ref: '#/components/schemas/RawRef'}
    AskUserData:
      type: object
      required: [step_id, question_id, questions]
      properties:
        step_id: {type: string}
        question_id: {type: string, description: Identifies this round of questions (the turn pauses as `awaiting_input` until `/answer`)}
        questions:
          type: array
          minItems: 1
          maxItems: 3
          items: {$ref: '#/components/schemas/AskUserQuestion'}
    AskUserQuestion:
      type: object
      required: [id, question, options, allow_other]
      properties:
        id: {type: string, description: The `question_id` of the matching `Answer`}
        question: {type: string}
        options:
          type: array
          items: {type: string}
        allow_other: {type: boolean, description: Whether a free-text `other` answer is accepted}
    TodoUpdatedData:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/TodoItem'}
    TodoItem:
      type: object
      required: [id, title, status]
      properties:
        id: {type: string}
        title: {type: string}
        status: {type: string, enum: [pending, in_progress, done, skipped]}
        budget_share: {type: integer, description: Tool calls planned for this item}
    SubtopicData:
      type: object
      required: [id, title, status]
      properties:
        id: {type: string, description: The todo item id of the subtopic}
        title: {type: string}
        status: {type: string, enum: [running, done, skipped, failed]}
        summary: {type: string, description: The subtopic summary (when done)}
    ToolCallData:
      type: object
      required: [step_id, tool, input]
      properties:
        step_id: {type: string}
        tool_call_id: {type: string, description: 'Pairs the call with its `tool_result`: a worker-assigned id `<step>:<n>` such as `orch:2` (a resumed attempt re-emits the same id), not the model''s tool-call id'}
        tool: {type: string, description: 'web_search, web_fetch, read_source, read_skill, ask_user, todo_write, research_subtopic, run_python; with --workspace-tools also exec_shell, read_file, write_file, list_dir; with --mcp-config mcp__<server>__<tool>'}
        input: {type: object, description: The tool arguments}
        subtopic_id: {type: string, description: The subtopic the call belongs to (absent for orchestrator calls)}
        raw: {$ref: '#/components/schemas/RawRef'}
    ToolResultData:
      type: object
      required: [step_id, tool, ok, preview]
      properties:
        step_id: {type: string}
        tool_call_id: {type: string}
        tool: {type: string}
        ok: {type: boolean}
        subtopic_id: {type: string}
        preview: {$ref: '#/components/schemas/ToolPreview'}
        error: {type: string, description: User-facing error of a failed call (the call still counts against the budget)}
        raw: {$ref: '#/components/schemas/RawRef'}
    ToolPreview:
      type: object
      description: |
        What the step row shows. `web_search`: `{results: [{title, url, site, snippet}]}` (plus `query`);
        `web_fetch`: `{title, url, excerpt}` (plus `n`, the source number, and `site`); other tools:
        `{text}`. `kind` (search, fetch or text) may name the shape.
      properties:
        kind: {type: string, enum: [search, fetch, text]}
        query: {type: string}
        results:
          type: array
          items: {$ref: '#/components/schemas/SearchResultPreview'}
        n: {type: integer, description: 'Source number used in citations `[n]`'}
        title: {type: string}
        url: {type: string}
        site: {type: string}
        excerpt: {type: string}
        text: {type: string}
    SearchResultPreview:
      type: object
      required: [title, url]
      properties:
        title: {type: string}
        url: {type: string}
        site: {type: string}
        snippet: {type: string}
    RawRef:
      type: object
      description: |
        The raw request and response behind a step (⟨/⟩). `request` is the request the worker sent, inline
        and redacted (no model, usage, costs or internal ids); it is cut to 32 KiB, in which case
        `request_truncated` is true and `request` is the truncated JSON text (a string). `response_ref` is
        the sha256 of the response blob, downloaded with `GET /turns/{turn_id}/raw/{response_ref}`.
      properties:
        request: {description: The request body (any JSON value; a string when truncated)}
        request_truncated: {type: boolean}
        response_ref: {type: string, pattern: '^[0-9a-f]{64}$'}
    BudgetData:
      type: object
      description: The turn's tool-call budget (from the Gateway's `X-Agentbox-Tool-Budget`); only web_search and web_fetch count.
      required: [used, limit]
      properties:
        used: {type: integer}
        limit: {type: integer}
    AssistantDeltaData:
      type: object
      description: A piece of the reply; concatenating the pieces with the same `message_id` in `seq` order gives the full text.
      required: [message_id, text]
      properties:
        message_id: {type: string}
        text: {type: string}
        final: {type: boolean, description: True on the last piece of the message}
    ReportReadyData:
      type: object
      description: The report was registered as an artifact (download with `GET /tasks/{turn_id}/artifacts/{artifact_id}?version=`).
      required: [artifact_id, version, title, partial, tool_budget_reached]
      properties:
        artifact_id: {type: string}
        version: {type: integer, format: int64}
        title: {type: string}
        partial: {type: boolean, description: True when written early ("write the report now") with subtopics skipped}
        tool_budget_reached: {type: boolean, description: True when the tool-call budget ran out (shown as "已达工具额度")}
        note: {type: string}
    TurnStoppedData:
      type: object
      description: The stop summary card of a stopped turn (built from the checkpoint) and a short "findings so far".
      required: [card, findings, can_finish]
      properties:
        card: {$ref: '#/components/schemas/StopCard'}
        findings: {type: string, description: '2–3 sentences; "尚无发现，研究在规划阶段被停止" when nothing was found yet'}
        can_finish: {type: boolean, description: True when at least one subtopic is done ("write the report now" is available)}
    StopCard:
      type: object
      required: [subtopics_done, subtopics_total, sources, tool_calls_used, tool_call_limit]
      properties:
        subtopics_done: {type: integer}
        subtopics_total: {type: integer}
        sources: {type: integer}
        tool_calls_used: {type: integer}
        tool_call_limit: {type: integer}
        todo:
          type: array
          items: {$ref: '#/components/schemas/TodoItem'}
    TurnResultData:
      type: object
      required: [summary, outputs]
      properties:
        summary: {type: string, description: The reply text}
        outputs:
          type: array
          description: Output artifact ids (`report` when a report was written)
          items: {type: string}
